name: CI graphics probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  graphics:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install Electron and test dependencies
        shell: bash
        run: |
          npm ci
          node node_modules/electron/install.js
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install --yes libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64 xvfb
          fi
      - name: Probe software WebGL2 and pixel readback
        shell: bash
        env:
          PERO_TEST_HEADED: '1'
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a node tests/e2e/graphics.mjs
          else
            node tests/e2e/graphics.mjs
          fi
