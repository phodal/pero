name: Agent Sandbox disposable acceptance

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read

concurrency:
  group: agent-sandbox-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kind:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'agent-sandbox-e2e'))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_PASSWORD: sandbox-fixture-only
          POSTGRES_USER: sandbox_fixture
          POSTGRES_DB: sandbox_fixture
        ports: [5432/tcp]
        options: >-
          --health-cmd "pg_isready -U sandbox_fixture -d sandbox_fixture"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      GOTOOLCHAIN: local
      PERO_TEST_DATABASE_URL: postgresql://sandbox_fixture:sandbox-fixture-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/sandbox_fixture?sslmode=disable
      PERO_REQUIRE_TEST_DATABASE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.4'
          cache-dependency-path: |
            server/go.sum
            harness/go/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.4'
      - name: Prepare pinned Rust and workspace-only GPUI resolution
        shell: bash
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
          kit="$RUNNER_TEMP/gpui-kit"
          git init --quiet "$kit"
          git -C "$kit" remote add origin https://github.com/longbridge/gpui-kit.git
          git -C "$kit" fetch --depth 1 origin ec89cfc36404667b7947aeb3d40b1c2859d729dd
          git -C "$kit" checkout --detach FETCH_HEAD
          echo "PERO_GPUI_KIT_PATH=$kit" >> "$GITHUB_ENV"
      - name: Build the real Worker and ACP agent
        shell: bash
        run: |
          node scripts/cargo.mjs test --locked -p pero-worker
          node scripts/cargo.mjs build --locked --release -p pero-worker
          CGO_ENABLED=0 go -C harness/go build -trimpath -o "$RUNNER_TEMP/pero-agent-acp" ./cmd/pero-agent-acp
          echo "PERO_SANDBOX_WORKER_BINARY=$PWD/target/release/pero-worker" >> "$GITHUB_ENV"
          echo "PERO_SANDBOX_AGENT_BINARY=$RUNNER_TEMP/pero-agent-acp" >> "$GITHUB_ENV"
          echo "PERO_SANDBOX_EVIDENCE=$RUNNER_TEMP/agent-sandbox-evidence" >> "$GITHUB_ENV"
      - name: Local process and PostgreSQL fault contracts
        shell: bash
        run: |
          mkdir -p "$PERO_SANDBOX_EVIDENCE"
          PERO_TEST_WORKER_BIN="$PERO_SANDBOX_WORKER_BINARY" PERO_TEST_AGENT_BIN="$PERO_SANDBOX_AGENT_BINARY" node --test deployment/agent-sandbox/test/*.test.mjs
          go -C server test -race -count=1 ./... 2>&1 | tee "$PERO_SANDBOX_EVIDENCE/server-test.log"
      - name: Create, test, and destroy the owned kind cluster
        shell: bash
        run: deployment/agent-sandbox/kind-smoke.sh
      - name: Retain non-secret validation receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-sandbox-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-sandbox-evidence/
          if-no-files-found: warn
          retention-days: 7
