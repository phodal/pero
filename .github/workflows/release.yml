name: Release Desktop products

on:
  push:
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag containing this packaging workflow
        required: true
        type: string
      sha:
        description: Optional commit the tag must peel to. Resolved from the tag when empty.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  dispatch:
    name: Dispatch tagged build on the default branch
    if: github.ref_type == 'tag' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Peel the tag without checking out the tag commit
        id: pin
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          url="https://github.com/${GH_REPO}.git"
          peeled=$(git ls-remote "$url" "refs/tags/${RELEASE_TAG}^{}" | awk 'NR==1 { print $1 }')
          if [[ -z "$peeled" ]]; then
            peeled=$(git ls-remote "$url" "refs/tags/${RELEASE_TAG}" | awk 'NR==1 { print $1 }')
          fi
          if [[ ! "$peeled" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Tag ${RELEASE_TAG} does not resolve to a commit" >&2
            exit 1
          fi
          echo "sha=${peeled}" >> "$GITHUB_OUTPUT"
      - name: Start native build with shared branch caches
        env:
          SHA: ${{ steps.pin.outputs.sha }}
        run: gh workflow run release.yml --ref "$RELEASE_BRANCH" --field "tag=$RELEASE_TAG" --field "sha=$SHA"

  scope:
    name: Decide Virtual Cell packaging scope
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - id: decide
        name: Run for relevant changes, the daily canary, or ci:full
        env:
          SCOPE_KIND: release-package
          SCOPE_EVENT: ${{ github.event_name }}
          SCOPE_LABELS: ${{ github.event_name == 'pull_request' && join(github.event.pull_request.labels.*.name, ',') || '' }}
          SCOPE_BASE: ${{ github.event.pull_request.base.sha }}
          SCOPE_PR: ${{ github.event.pull_request.number }}
        run: |
          files=""
          if [[ "$SCOPE_EVENT" == "pull_request" ]]; then
            if git fetch --no-tags --depth=1 origin "${SCOPE_BASE}:refs/remotes/origin/pr-base" "refs/pull/${SCOPE_PR}/head:refs/remotes/origin/pr-head"; then
              files=$(git diff --name-only refs/remotes/origin/pr-base refs/remotes/origin/pr-head)
            else
              echo "Cannot read the pull request diff; running the check." >&2
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          printf '%s\n' "$files" | node scripts/ci/workflow-scope.mjs

  resolve:
    name: Pin the requested tag
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: pin
        name: Peel the tag before checkout
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: node scripts/ci/deployment-gate.mjs pin-tag

  gate:
    name: Require trusted CI for the tag commit
    needs: resolve
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reject a missing, red, cancelled, or mismatched CI result
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_REPOSITORY: ${{ github.repository }}
          GATE_TARGET_SHA: ${{ needs.resolve.outputs.sha }}
        run: node scripts/ci/deployment-gate.mjs ci

  build:
    needs: [scope, resolve, gate]
    if: >-
      always() && !cancelled() &&
      ((github.event_name == 'workflow_dispatch' && needs.resolve.result == 'success' && needs.gate.result == 'success') ||
       ((github.event_name == 'schedule' || github.event_name == 'pull_request') && needs.scope.outputs.run == 'true'))
    name: ${{ matrix.product }} (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '[
          {"os":"macos-15","platform":"macos","arch":"arm64","product":"pero"},
          {"os":"macos-15","platform":"macos","arch":"arm64","product":"pero-native"},
          {"os":"ubuntu-24.04","platform":"linux","arch":"x64","product":"pero"},
          {"os":"windows-2025","platform":"windows","arch":"x64","product":"pero"}
          ]' || '[{"os":"macos-15","platform":"macos","arch":"arm64","product":"virtual-cell"}]') }}
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && needs.resolve.outputs.sha || '' }}
      RELEASE_PRODUCT: ${{ matrix.product }}
      CARGO_BUILD_JOBS: '2'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Checkout build source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && needs.resolve.outputs.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse a tree that is not the admitted SHA
        env:
          ADMITTED_SHA: ${{ github.event_name == 'workflow_dispatch' && needs.resolve.outputs.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$ADMITTED_SHA"

      - name: Refuse a tag that no longer points at this checkout
        if: env.RELEASE_TAG != ''
        run: |
          git fetch --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$(git rev-parse HEAD)"

      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: |
          git config --local core.autocrlf false
          git checkout -- .

      - name: Check native runner architecture
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
        run: node -e "if (process.arch !== process.env.RELEASE_ARCH) throw Error('Unexpected runner architecture')"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Set up Go for bundled harness
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache-dependency-path: harness/go/go.sum

      - name: Set up Rust nightly
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-10-28
          targets: wasm32-unknown-unknown

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.product }}

      - name: Checkout pinned GPUI snapshot
        run: |
          kit="$RUNNER_TEMP/gpui-kit"
          echo "PERO_GPUI_KIT_PATH=$kit" >> "$GITHUB_ENV"
          git init --quiet "$kit"
          git -C "$kit" remote add origin https://github.com/longbridge/gpui-kit.git
          git -C "$kit" fetch --depth 1 origin 7591a35eced761e3613c01e71ff04c10129dae1a
          git -C "$kit" checkout --detach FETCH_HEAD

      - name: Install package dependencies
        run: |
          mkdir -p target/release-diagnostics
          npm ci 2>&1 | tee target/release-diagnostics/npm-ci.log
          node node_modules/electron/install.js
          if [[ "$RUNNER_OS" == macOS ]]; then brew install librsvg; fi
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install --yes python3-venv libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64 xvfb
          fi
          python3 -c 'import venv, ensurepip'

      - name: Embed workflow build metadata
        run: node scripts/release/desktop.mjs prepare

      - name: Resolve pinned local GPUI packages
        run: node scripts/cargo.mjs check -p pero-contracts 2>&1 | tee target/release-diagnostics/resolve.log

      - name: Build workbench package
        if: matrix.product == 'pero'
        run: npm run package:desktop 2>&1 | tee target/release-diagnostics/package.log

      - name: Build portable Native GPUI package
        if: matrix.product == 'pero-native'
        run: npm run package:macos-native 2>&1 | tee target/release-diagnostics/package.log

      - name: Fetch pinned standalone Python
        if: matrix.product == 'virtual-cell'
        run: node scripts/release/python.mjs

      - name: Build standalone Virtual Cell (macOS only)
        if: matrix.product == 'virtual-cell'
        run: npm run build:product -- --product virtual-cell --python "$RUNNER_TEMP/virtual-cell-python/python" --package 2>&1 | tee target/release-diagnostics/package.log

      - name: Check generated contracts and types
        run: npm run check 2>&1 | tee target/release-diagnostics/check.log

      - name: Verify package and checksums
        run: node scripts/release/desktop.mjs verify

      - name: Launch actual packaged Desktop outside checkout
        if: matrix.product == 'pero' || matrix.product == 'pero-native'
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a node scripts/release/desktop.mjs smoke 2>&1 | tee target/release-diagnostics/smoke.log
          else
            node scripts/release/desktop.mjs smoke 2>&1 | tee target/release-diagnostics/smoke.log
          fi

      - name: Verify standalone App and bundled Python
        if: matrix.product == 'virtual-cell'
        run: npm run test:product:e2e 2>&1 | tee target/release-diagnostics/smoke.log

      - name: Stage verified release assets
        run: node scripts/release/desktop.mjs stage

      - name: Upload verified package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.product == 'virtual-cell' && format('push-{0}-{1}-{2}', matrix.product, matrix.platform, matrix.arch) || format('release-{0}-{1}-{2}-{3}', needs.resolve.outputs.sha, matrix.product, matrix.platform, matrix.arch) }}
          path: target/release-assets/
          if-no-files-found: error
          retention-days: 7

      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ matrix.product }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            target/release-diagnostics/
            target/package/size.json
            desktop/dist/release.json
            test-results/release/
            test-results/product/
            test-results/native-package/
            target/native-package/size.json
            target/products/package-com.openpero.virtualcell/size.json
          if-no-files-found: ignore
          retention-days: 7

  publish:
    if: always() && !cancelled() && github.event_name == 'workflow_dispatch' && needs.build.result == 'success' && needs.resolve.result == 'success'
    name: Publish all verified products together
    needs: [build, resolve]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GATE_REPOSITORY: ${{ github.repository }}
      GATE_TARGET_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reject a moved tag or a CI result that is no longer green
        run: |
          node scripts/ci/deployment-gate.mjs pin-tag
          node scripts/ci/deployment-gate.mjs ci
      - uses: actions/download-artifact@v8
        with:
          pattern: release-${{ needs.resolve.outputs.sha }}-*
          path: release-assets
          merge-multiple: true

      - name: Require every dispatch manifest to match its archive
        env:
          GATE_REQUIRED_ARCHIVES: Pero-macos-arm64.dmg,Pero-Native-macos-arm64.dmg,Pero-linux-x64.tar.gz,Pero-windows-x64.zip
        run: node scripts/ci/deployment-gate.mjs manifests release-assets

      - name: Verify combined checksums
        working-directory: release-assets
        run: |
          cat *.SHA256SUMS > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF_NOTES'
          Pero Desktop development packages, built and launch-tested on native GitHub Actions runners.

          - Pero: macOS Apple Silicon DMG, Windows x64 portable ZIP, Linux x64 portable tar.gz.
          - Pero Native: separate macOS Apple Silicon DMG using GPUI and system WebKit, with bundled Host, Node and Apps; no source checkout needed. Native and Electron use separate data profiles.
          - Task Center defaults to https://app.openpero.com.
          - No source checkout needed: sign in, claim a public task and choose a save folder. Pero clones the repository and creates the task branch.
          - Native local sessions and Apps are available; preparing a cloud contribution workspace is currently supported by Electron only. Python App environments are prepared on first use.
          - Install Git and a supported coding CLI and authenticate the CLI before starting. Native coding CLIs are not bundled.
          - To publish PRs, install GitHub CLI from https://cli.github.com and run `gh auth login --hostname github.com --git-protocol https` in any directory. Then check changes again in Pero. App sign-in and gh authorization are separate.
          - macOS packages are ad-hoc signed and not notarized; Windows/Linux packages are unsigned development builds.
          - Per-product build metadata and SHA256SUMS accompany every archive.
          EOF_NOTES

      - name: Upload to a draft, then publish only if the tag still matches
        run: |
          # The tag can still move between the last pin and the undraft call.
          # Keeping the release drafted until that pin succeeds stops a moved
          # tag from becoming a public release. The undraft call itself is not
          # atomic with the tag, so that last window remains.
          draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [[ -z "$draft" ]]; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --title "Pero $RELEASE_TAG" --notes-file release-notes.md
          elif [[ "$draft" != true ]]; then
            echo 'A published release already exists; refusing to replace its packages.' >&2
            exit 1
          else
            gh release edit "$RELEASE_TAG" --draft=true --title "Pero $RELEASE_TAG" --notes-file release-notes.md
          fi
          node scripts/ci/deployment-gate.mjs pin-tag
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          node scripts/ci/deployment-gate.mjs pin-tag
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=true
