name: Locked scientific environments on Linux

# Explicit real downloads and computation on a disposable x86_64 runner.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: locked-scientific-linux-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare-and-use:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.4'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
          architecture: x64
      - name: Record runner and configure isolated evidence
        run: |
          test "$(uname -m)" = x86_64
          evidence="$RUNNER_TEMP/locked-scientific-evidence"
          mkdir -p "$evidence"
          echo "PERO_SCIENCE_EVIDENCE=$evidence" >> "$GITHUB_ENV"
          echo "PERO_SCIENTIFIC_APP_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "PERO_APP_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$evidence/source.txt"
          uname -a > "$evidence/platform.txt"
          python --version >> "$evidence/platform.txt"
          df -h >> "$evidence/platform.txt"
      - name: Prepare pinned Rust and workspace GPUI resolution
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
          kit="$RUNNER_TEMP/gpui-kit"
          git init --quiet "$kit"
          git -C "$kit" remote add origin https://github.com/longbridge/gpui-kit.git
          git -C "$kit" fetch --depth 1 origin 7591a35eced761e3613c01e71ff04c10129dae1a
          git -C "$kit" checkout --detach FETCH_HEAD
          echo "PERO_GPUI_KIT_PATH=$kit" >> "$GITHUB_ENV"
      - name: Install native circuit solver for the actual process-owner gate
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y ngspice
          ngspice --version > "$PERO_SCIENCE_EVIDENCE/ngspice-version.txt"
      - name: Package shared Python modules and require the real test entry points
        run: |
          node scripts/build/source-parsers.mjs
          node scripts/build/scientific-runtime.mjs
          node scripts/cargo.mjs test --locked -p pero-runtime --lib -- --list 2>&1 | tee "$PERO_SCIENCE_EVIDENCE/test-list.log"
          cp Cargo.lock "$PERO_SCIENCE_EVIDENCE/resolved-Cargo.lock"
          python - <<'PY'
          import os
          from pathlib import Path
          names = Path(os.environ['PERO_SCIENCE_EVIDENCE'], 'test-list.log').read_text().splitlines()
          for name in ('apps::locked_python::tests::locked_control_rebuild_and_recovery',
                       'apps::scientific_uses::tests::managed_control_attempt_and_cancel',
                       'apps::scientific_uses::tests::managed_pcgym_attempt_and_cancel'):
              assert names.count(name + ': test') == 1, f'Missing live test: {name}'
          PY
      - name: Control real locked preparation, rebuild and recovery
        timeout-minutes: 10
        run: |
          PERO_UV_LIVE_METHOD=control PERO_UV_LIVE_HOME="$PERO_SCIENCE_EVIDENCE/control" \
            node scripts/cargo.mjs test --locked -p pero-runtime --lib \
            apps::locked_python::tests::locked_control_rebuild_and_recovery -- --exact --ignored --nocapture \
            2>&1 | tee "$PERO_SCIENCE_EVIDENCE/control-prepare.log"
      - name: Control actual attempt, drift refusal, cancellation and Use release
        timeout-minutes: 10
        run: |
          PERO_UV_LIVE_HOME="$PERO_SCIENCE_EVIDENCE/control" \
            node scripts/cargo.mjs test --locked -p pero-runtime --lib \
            apps::scientific_uses::tests::managed_control_attempt_and_cancel -- --exact --ignored --nocapture \
            2>&1 | tee "$PERO_SCIENCE_EVIDENCE/control-use.log"
      - name: Fetch the fixed PC-Gym source
        run: |
          checkout="$RUNNER_TEMP/pc-gym"
          git init --quiet "$checkout"
          git -C "$checkout" remote add origin https://github.com/MaximilianB2/pc-gym.git
          git -C "$checkout" fetch --depth 1 origin fbfb36bf84b494cd157cff88292e1fd1b864cee5
          git -C "$checkout" checkout --detach FETCH_HEAD
          git -C "$checkout" rev-parse HEAD > "$PERO_SCIENCE_EVIDENCE/pcgym-source.txt"
          echo "PERO_SCIENTIFIC_LIVE_CHECKOUT=$checkout" >> "$GITHUB_ENV"
      - name: PC-Gym real CPU-only locked preparation, rebuild and recovery
        timeout-minutes: 15
        run: |
          PERO_UV_LIVE_METHOD=pcgym PERO_UV_LIVE_HOME="$PERO_SCIENCE_EVIDENCE/pcgym" \
            node scripts/cargo.mjs test --locked -p pero-runtime --lib \
            apps::locked_python::tests::locked_control_rebuild_and_recovery -- --exact --ignored --nocapture \
            2>&1 | tee "$PERO_SCIENCE_EVIDENCE/pcgym-prepare.log"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['PERO_SCIENCE_EVIDENCE'])
          profiles = json.loads((root / 'pcgym/profiles.json').read_text())
          profile = next(value['prepared'] for value in profiles if value['label'] == 'first')
          (root / 'pcgym-profile.json').write_text(json.dumps(profile))
          PY
      - name: PC-Gym actual attempt, independent export check, cancellation and Use release
        timeout-minutes: 15
        run: |
          PERO_SCIENTIFIC_LIVE_HOME="$PERO_SCIENCE_EVIDENCE/pcgym-use" \
          PERO_SCIENTIFIC_LIVE_PROFILE="$PERO_SCIENCE_EVIDENCE/pcgym-profile.json" \
            node scripts/cargo.mjs test --locked -p pero-runtime --lib \
            apps::scientific_uses::tests::managed_pcgym_attempt_and_cancel -- --exact --ignored --nocapture \
            2>&1 | tee "$PERO_SCIENCE_EVIDENCE/pcgym-use.log"
      - name: Retain logs, locks, preparation observations and execution receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: locked-scientific-linux-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/locked-scientific-evidence/*.log
            ${{ runner.temp }}/locked-scientific-evidence/*.txt
            ${{ runner.temp }}/locked-scientific-evidence/*.lock
            ${{ runner.temp }}/locked-scientific-evidence/*.json
            ${{ runner.temp }}/locked-scientific-evidence/*/profiles.json
            ${{ runner.temp }}/locked-scientific-evidence/*/environment/profiles/*.recipe/**
            ${{ runner.temp }}/locked-scientific-evidence/control/*.log
            ${{ runner.temp }}/locked-scientific-evidence/control/*.json
            ${{ runner.temp }}/locked-scientific-evidence/control/app-data/**
            ${{ runner.temp }}/locked-scientific-evidence/pcgym-use/**
