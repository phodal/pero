name: CI scientific-viewer

# Reusable jobs only: all automatic triggers and required gates stay in CI.
on:
  workflow_call:
    inputs:
      suite:
        description: CI-owned job family
        type: string
        required: true
      os:
        type: string
        default: ubuntu-latest
      upload-runtime:
        type: boolean
        default: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  scientific-viewer:
    if: inputs.suite == 'scientific-viewer'
    name: Scientific Viewer browser inspection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/scientific-viewer/requirements.txt
      - name: Prepare pinned App and actual molecular engine
        id: prepare
        run: |
          npm ci --ignore-scripts
          npm ci --prefix apps/scientific-viewer --ignore-scripts
          python -m pip install --only-binary=:all: -r apps/scientific-viewer/requirements.txt
          npx playwright install --with-deps chromium
          npm run build --prefix apps/scientific-viewer
      - name: Verify App context handshake and cross-origin bridge
        run: node tests/e2e/app-use-bridge.mjs
      - name: Verify imported files, charts, molecules and responsive themes
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: node tests/e2e/scientific-viewer-browser.mjs
      - name: Verify Research Lab meshes, offline copies and resource cleanup
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: node tests/e2e/research-lab-browser.mjs
      - name: Verify artifact previews and Gallery keyboard behavior
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: node apps/scientific-viewer/test/artifact-browser.mjs
      - name: Viewer screenshots and exact bundle evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scientific-viewer-browser-${{ github.sha }}
          path: |
            test-results/scientific-viewer-browser/
            test-results/session-artifacts-viewer/
            test-results/research-lab-browser/
          if-no-files-found: warn

