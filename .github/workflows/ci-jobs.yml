name: CI job implementations

# Reusable jobs only: all automatic triggers and required gates stay in CI.
on:
  workflow_call:
    inputs:
      suite:
        description: CI-owned job family
        type: string
        required: true
      os:
        type: string
        default: ubuntu-latest
      upload-runtime:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  desktop:
    if: inputs.suite == 'desktop'
    defaults:
      run:
        shell: bash
    name: Build, check, and Rust tests (${{ inputs.os }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Windows Git would otherwise rewrite LF and make the generator checks stale.
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: |
          git config --local core.autocrlf false
          git checkout -- .

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Generated contracts fail fast before compilation
        run: node scripts/codegen/contracts.mjs --check

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/scientific-viewer/requirements.txt

      - name: Real molecular backend on this platform
        run: |
          python -m pip install --only-binary=:all: -r apps/scientific-viewer/requirements.txt
          python -m unittest discover -s apps/scientific-viewer/test -p 'test_*.py'

      - name: Computer Use loopback transport contracts
        run: node tests/e2e/computer-transport.mjs

      - name: Set up Rust nightly
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-10-28
          targets: wasm32-unknown-unknown

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Set up Go for bundled harness
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache-dependency-path: harness/go/go.sum

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target
            use/computer -> ../../target/computer
            use/connectors/worker -> target

      - name: Cache exact wasm-bindgen tool
        uses: actions/cache@v4
        with:
          path: target/tools
          key: wasm-bindgen-${{ runner.os }}-${{ runner.arch }}-0.2.127-v1


      # Outside this repo. A checkout inside it is absorbed by the Cargo workspace.
      - name: Checkout gpui-kit
        run: |
          kit="$RUNNER_TEMP/gpui-kit"
          echo "PERO_GPUI_KIT_PATH=$kit" >> "$GITHUB_ENV"
          git init --quiet "$kit"
          git -C "$kit" config core.autocrlf false
          git -C "$kit" remote add origin https://github.com/longbridge/gpui-kit.git
          git -C "$kit" fetch --depth 1 origin 7591a35eced761e3613c01e71ff04c10129dae1a
          git -C "$kit" checkout --detach FETCH_HEAD

      # scripts/build/fonts.mjs creates a venv when fontTools is not already installed.
      - name: Prepare Python for font subsetting
        run: |
          if python3 -c 'import venv, ensurepip'; then
            exit 0
          fi
          case "$RUNNER_OS" in
            Linux)
              sudo apt-get update
              sudo apt-get install --yes python3-venv
              ;;
            macOS)
              brew install python@3
              ;;
            Windows)
              echo "python3 with the venv module is required for font subsetting" >&2
              exit 1
              ;;
          esac

      - name: Font-tool environment recovery tests
        run: node --test scripts/build/fonttools.test.mjs scripts/build/patch-checkout.test.mjs scripts/build/gpui-kit.test.mjs
      - name: Agent background process contracts
        run: node --test tests/runtime/agent-background.test.mjs
      - name: Resolve pinned local GPUI packages
        run: node scripts/cargo.mjs check -p pero-contracts

      - name: Build
        run: npm run build

      - name: Compile and test the Native GPUI and Wry shell
        if: runner.os == 'macOS'
        run: |
          node scripts/cargo.mjs +nightly-2026-10-28 check --locked -p pero-ui --features native --bin pero-native
          node scripts/cargo.mjs +nightly-2026-10-28 test --locked -p pero-ui --features native --lib

      - name: Read-only Native Paper WebView origin probe
        if: runner.os == 'macOS'
        env:
          PERO_NATIVE_PROBE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PERO_NATIVE_PROBE_RUN_ID: ${{ github.run_id }}
        run: |
          node scripts/cargo.mjs +nightly-2026-10-28 build --locked -p pero-ui --features native-probe --bin pero-native
          node tests/e2e/native-docling-origin.mjs

      - name: Native Paper WebView origin evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: native-docling-origin-${{ github.sha }}
          path: test-results/native-docling-origin/
          if-no-files-found: warn
          retention-days: 7

      - name: Typecheck and generated sources
        run: |
          npm run check
          npm --prefix apps/virtual-cell run typecheck
          npm --prefix apps/virtual-cell run test:ui
          npm --prefix apps/control-lab run typecheck
          npm --prefix apps/control-lab run test:ui
          npm --prefix apps/data run typecheck
          npm --prefix apps/data run test:ui
          node --test web/src/automation-model.test.ts tests/contracts/automation.test.mjs
          node --test web/src/host-connection.test.ts web/src/mcp-settings-bridge.test.ts

      - name: Test
        run: npm test

      - name: App Use and goal authorization tests
        if: runner.os == 'Linux'
        run: |
          npm run test:app-use:unit
          node --test tests/runtime/control-lab/host-goal.test.ts

      - name: Host contract tests
        run: npm run test:contracts

      - name: Linux fixture and transport contracts
        if: runner.os == 'Linux'
        run: |
          node -e "require('esbuild').buildSync({entryPoints:['desktop/src/main/app-use.test.ts','desktop/src/main/app-context.test.ts'],outdir:process.env.RUNNER_TEMP+'/app-use-tests',bundle:true,platform:'node',format:'esm',external:['electron']})"
          node --test "$RUNNER_TEMP"/app-use-tests/*.js
          node --test tests/fixtures/app-use-content.test.mjs tests/fixtures/app-use-progress.test.mjs tests/fixtures/app-chat-launch.test.mjs tests/fixtures/acp-agent.test.mjs tests/fixtures/owned-electron-close.test.mjs
          node --test tests/runtime/control-lab/*.test.mjs
          node tests/runtime/automation.mjs
          node tests/contracts/mcp-settings.mjs
          node tests/contracts/mcp-ownership.mjs

      - name: Package same-revision Linux acceptance runtime
        if: inputs.upload-runtime
        run: node scripts/ci/desktop-artifact.mjs pack "$RUNNER_TEMP/desktop-runtime.tgz"
      - uses: actions/upload-artifact@v7
        if: inputs.upload-runtime
        with:
          name: desktop-runtime-${{ github.sha }}-Linux-X64
          path: ${{ runner.temp }}/desktop-runtime.tgz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Build and contract evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-build-evidence
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  notebook:
    if: inputs.suite == 'notebook'
    defaults:
      run:
        shell: bash
    name: Notebook revisions, workbook and browser contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/notebook/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Prepare Notebook dependencies and browser
        id: prepare
        run: |
          npm ci --ignore-scripts
          node scripts/build/source-parsers.mjs
          python -c 'import json,subprocess,sys; subprocess.check_call([sys.executable,"-m","pip","install","--only-binary=:all:",*json.load(open("apps/notebook/app.json"))["backend"]["dependencies"]])'
          sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
          npm ci --prefix apps/notebook --ignore-scripts
          npx playwright install --with-deps chromium
          npm --prefix apps/notebook run build
      - name: Verify documents, formulas, XLSX exchange and Agent revisions
        env:
          NOTEBOOK_REAL_OCR: "1"
        run: npm run test:notebook
      - name: Verify packaged source parser imports
        run: node --test scripts/build/source-parsers.test.mjs scripts/build/notebook-citations.test.mjs
      - name: Verify installed App catalog owner contracts
        run: node --test packages/app-sdk/test/installed-app-views.test.mjs packages/app-sdk/test/app-canvas.test.mjs desktop/src/main/apps-frames.test.ts desktop/src/main/app-canvas.test.ts desktop/src/main/notebook-projects.test.ts
      - name: Verify Notebook types
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: npm --prefix apps/notebook run typecheck
      - name: Verify real editor persistence, imports and clipboard references
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: npm --prefix apps/notebook run test:browser
      - name: Retain Notebook browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: notebook-browser-${{ github.sha }}
          path: test-results/notebook/
          if-no-files-found: warn


  browser:
    if: inputs.suite == 'notebook-canvas'
    name: Notebook Canvas real Host and Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/notebook/package-lock.json
            apps/control-lab/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Prepare pinned reader Wasm target for Control Lab
        run: rustup toolchain install nightly-2026-10-28 --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Checkout pinned GPUI manifest inputs
        run: |
          kit="$RUNNER_TEMP/gpui-kit"
          echo "PERO_GPUI_KIT_PATH=$kit" >> "$GITHUB_ENV"
          git init --quiet "$kit"
          git -C "$kit" config core.autocrlf false
          git -C "$kit" remote add origin https://github.com/longbridge/gpui-kit.git
          git -C "$kit" fetch --depth 1 origin 7591a35eced761e3613c01e71ff04c10129dae1a
          git -C "$kit" checkout --detach FETCH_HEAD
      - name: Build Notebook and prepare Chromium
        run: |
          npm ci --ignore-scripts
          npm ci --prefix apps/notebook --ignore-scripts
          npm ci --prefix apps/control-lab --ignore-scripts
          npm --prefix apps/notebook run build
          npm --prefix apps/control-lab run build
          npx playwright install --with-deps chromium
      - name: Build real Host without Desktop or Wasm
        run: node scripts/cargo.mjs build --locked -p pero-host
      - name: Prepare declared Notebook, Paper and Control Lab Python environment
        run: |
          node scripts/build/source-parsers.mjs
          node scripts/build/scientific-runtime.mjs
          python -m venv "$RUNNER_TEMP/notebook-canvas-python"
          "$RUNNER_TEMP/notebook-canvas-python/bin/python" -c 'import json,subprocess,sys; dependencies=[dep for app in ("notebook", "paper-agent", "control-lab") for dep in json.load(open(f"apps/{app}/app.json"))["backend"]["dependencies"]]; subprocess.run([sys.executable,"-m","pip","install","--only-binary=:all:",*dependencies],check=True)'
          echo "PERO_APP_PYTHON=$RUNNER_TEMP/notebook-canvas-python/bin/python" >> "$GITHUB_ENV"
      - name: Verify Canvas against actual Data and Control Lab owners
        timeout-minutes: 10
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: node --test tests/e2e/notebook-canvas-browser.mjs tests/e2e/notebook-control-canvas.mjs
      - name: Retain Canvas browser evidence and verification scope
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: notebook-canvas-browser-${{ github.sha }}
          path: test-results/notebook-canvas/
          if-no-files-found: warn
          retention-days: 7

  native-ui:
    if: inputs.suite == 'native-ui'
    name: Native shell compilation and unit contracts
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-10-28
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Checkout pinned GPUI outside the Cargo workspace
        run: |
          kit="$RUNNER_TEMP/gpui-kit"
          echo "PERO_GPUI_KIT_PATH=$kit" >> "$GITHUB_ENV"
          git init --quiet "$kit"
          git -C "$kit" config core.autocrlf false
          git -C "$kit" remote add origin https://github.com/longbridge/gpui-kit.git
          git -C "$kit" fetch --depth 1 origin 7591a35eced761e3613c01e71ff04c10129dae1a
          git -C "$kit" checkout --detach FETCH_HEAD
      - name: Prepare the fonts embedded by the Native shell
        run: node scripts/build/fonts.mjs
      - name: Compile Native entry point and shell wiring
        run: node scripts/cargo.mjs +nightly-2026-10-28 check --locked -p pero-ui --features native --bin pero-native
      - name: Test Native Canvas transport and private consent contracts
        run: node scripts/cargo.mjs +nightly-2026-10-28 test --locked -p pero-ui --features native --lib
