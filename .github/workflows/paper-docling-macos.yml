name: Paper optional Docling on macOS

# Explicitly opted-in, disposable runner verification. No push/schedule/release
# hook, privileged pull_request_target, secrets, or user Desktop installation.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - .github/workflows/paper-docling-macos.yml
      - apps/paper-agent/app.json
      - packages/source-extraction/**
      - scripts/build/source-parsers.mjs
      - apps/paper-agent/requirements-docling*.txt
      - apps/paper-agent/backend/paper_agent/docling*.py
      - apps/paper-agent/backend/paper_agent/numeric*.py
      - apps/paper-agent/backend/paper_agent/pdf*.py
      - apps/paper-agent/test/manual/docling*.py
      - apps/paper-agent/test/test_docling*.py
      - apps/paper-agent/test/test_numeric*.py
      - apps/paper-agent/test/fixtures/*corpus*.json
      - crates/pero-runtime/src/apps/docling*
  workflow_dispatch:
    inputs:
      allow_official_downloads:
        description: Download pinned Docling wheels, Heron model and three public NASA scans on a temporary Mac runner
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: paper-docling-macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  docling:
    name: Official install, Vision, original scans and HTTP persistence
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.allow_official_downloads) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'ci:full') &&
       (github.event.action != 'labeled' || github.event.label.name == 'ci:full'))
    # GitHub's standard arm64 label; macOS-26-arm64 is an image name, not a label.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '2'
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: arm64
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: paper-docling-macos

      - name: Prepare ordinary Paper dependencies, separately from Docling
        timeout-minutes: 5
        run: |
          node scripts/build/source-parsers.mjs
          python -c 'import json,subprocess,sys; dependencies=json.load(open("apps/paper-agent/app.json"))["backend"]["dependencies"]; subprocess.run([sys.executable,"-m","pip","install","--only-binary=:all:",*dependencies],check=True)'

      # Cargo's existing wrapper needs these pinned workspace manifest inputs;
      # this job compiles only pero-runtime, not the Desktop or release bundle.
      - name: Checkout pinned GPUI manifest inputs
        timeout-minutes: 5
        run: |
          kit="$RUNNER_TEMP/gpui-kit"
          echo "PERO_GPUI_KIT_PATH=$kit" >> "$GITHUB_ENV"
          git init --quiet "$kit"
          git -C "$kit" remote add origin https://github.com/longbridge/gpui-kit.git
          git -C "$kit" fetch --depth 1 origin 7591a35eced761e3613c01e71ff04c10129dae1a
          git -C "$kit" checkout --detach FETCH_HEAD

      - name: Compile existing ignored Host installation smoke
        timeout-minutes: 15
        run: node scripts/cargo.mjs test --locked -p pero-runtime --lib apps::docling_runtime::tests::official_optional_runtime_end_to_end --no-run

      - name: Verify approved installation and real Mac execution
        timeout-minutes: 40
        run: |
          python apps/paper-agent/test/manual/docling_ci.py --allow-official-downloads \
            --root "$RUNNER_TEMP/paper-docling-ci" --output test-results/paper-docling-macos

      - name: Preserve exact-head evidence, including failed stages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paper-docling-macos-${{ env.EXPECTED_HEAD_SHA }}-${{ github.run_attempt }}
          path: test-results/paper-docling-macos/
          if-no-files-found: warn
          retention-days: 7
