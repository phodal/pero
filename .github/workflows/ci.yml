# Toolchains follow the repo, not a compatibility matrix:
# Node.js 22 (desktop/README.md: 22.12+), npm from package-lock.json
# Rust stable, plus nightly-2026-10-28 for Wasm (scripts/build/wasm.mjs)
# gpui-kit ec89cfc (desktop/README.md, scripts/build/fonts.manifest.json)
# Go 1.26.4 (MODULE.bazel). server/go.mod's `go 1.24` is the language version.
# Bazel 9.2.0 (.bazelversion). pnpm-lock.yaml is the Bazel translation of the npm lock.
# PR/push runs Linux contracts and three critical Desktop smokes. Daily/manual
# runs all Desktop scenarios and platforms; Worker Unix cfg gates remain intact.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 20 * * *" # 04:00 UTC+08; GitHub runs schedules on the default branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full' || 'linux' }}
  cancel-in-progress: ${{ !(github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}

defaults:
  run:
    shell: bash

jobs:
  data:
    name: Data local catalog and download contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test opaque imports, bounded downloads and restart persistence
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s apps/data/test -p 'test_*.py' -v

  control-lab:
    name: Control Lab actual python-control and ngspice
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install real numerical engines
        run: |
          sudo apt-get update
          sudo apt-get install --yes ngspice
          python -m pip install --only-binary=:all: -r apps/control-lab/requirements.txt
          mkdir -p test-results/control-lab-science
          python -c 'import control; print(control.__version__)' | tee test-results/control-lab-science/python-control-version.txt
          ngspice --version | tee test-results/control-lab-science/ngspice-version.txt
      - name: Require both numerical engines and scientific contracts without dependency skips
        env:
          CONTROL_LAB_REQUIRE_SOLVERS: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s apps/control-lab/test -p 'test_*.py' -v 2>&1 | tee test-results/control-lab-science/tests.log
      - name: Numerical engine versions and scientific results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: control-lab-science-linux
          path: test-results/control-lab-science/
          if-no-files-found: warn
          retention-days: 7

  virtual-cell:
    name: Virtual Cell local comparison contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install preparation-test dependencies
        run: python -m pip install -r apps/virtual-cell/tools/norman/test-requirements.txt
      - name: Verify preparation tests cannot silently skip dependencies
        run: python -c 'import numpy, scipy'
      - name: Test scientific boundaries and local process lifecycle
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s apps/virtual-cell/test -p 'test_*.py' -v

  bazel:
    name: Bazel checks and server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('["ubuntu-latest","windows-latest","macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Windows Git would otherwise rewrite LF and change the Bazel lock hashes.
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: |
          git config --local core.autocrlf false
          git checkout -- .

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-version: 1.x
          bazelisk-cache: true
          repository-cache: true

      # rules_js cannot refresh the pnpm lock on Windows, and its text diffs are
      # byte compares that do not match the LF sources there. npm run check
      # still runs those generators on Windows in the desktop job.
      - name: Test generated checks
        if: runner.os != 'Windows'
        run: bazel test --config=ci //:checks

      - name: Build control plane
        run: bazel build //server/cmd/server

  go:
    name: Go tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('["ubuntu-latest","windows-latest","macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.4"
          cache-dependency-path: server/go.sum

      - name: Test
        working-directory: server
        run: go test -race ./...

  harness:
    name: Harness Go contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('["ubuntu-latest","windows-latest","macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache-dependency-path: harness/go/go.sum
      - name: Harness race tests
        working-directory: harness/go
        run: go test -race -count=1 ./...
      - name: Harness vet and build
        working-directory: harness/go
        run: |
          go vet ./...
          go build ./cmd/pero-agent-acp

  harness-bazel:
    name: Standalone harness Bazel contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: harness/go
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-version: 1.x
          bazelisk-cache: true
          repository-cache: true
      - name: Verify generated build declarations
        run: bazel run --lockfile_mode=error //:gazelle -- -mode=diff
      - name: Build standalone agent
        run: bazel build --lockfile_mode=error //cmd/pero-agent-acp
      - name: Test standalone contracts with race detector
        run: bazel test --lockfile_mode=error --@rules_go//go/config:race=true //...

  strict-sandbox:
    name: Positive Linux strict sandbox contract
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      GOWORK: "off"
      PERO_REQUIRE_STRICT_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache-dependency-path: harness/go/go.sum
      - name: Install supported sandbox backend
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap
      - name: Require positive isolation contract
        working-directory: harness/go
        run: go test -count=1 -v ./sandbox -run '^TestNativeRuntime$'

  windows-acl-sandbox:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Positive Windows file and partial ACL contracts
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GOWORK: "off"
      PERO_REQUIRE_WINDOWS_ACL: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache-dependency-path: harness/go/go.sum
      # Explicitly authorized security tests: ACL/Low integrity edits apply only
      # to test-created temporary directories, never this checkout/user projects.
      - name: Require positive partial-boundary and lifecycle contracts
        working-directory: harness/go
        run: |
          go test -race -count=1 -json ./fstools ./sandbox ./shell ./nativetools ./cmd/pero-agent-acp -run "Windows|TestCodingModelCLICombinedActivationWire" | tee "$RUNNER_TEMP/windows-acl-results.jsonl"
          python - "$RUNNER_TEMP/windows-acl-results.jsonl" <<'PYTEST'
          import json, sys
          expected = {
              "TestWindowsACLRuntime",
              "TestWindowsACLJobLifecycle",
              "TestWindowsACLAmbientAndForeignRoots",
              "TestWindowsACLAdmissionBoundaries",
              "TestWindowsACLGrantRepairAndRevoke",
              "TestWindowsACLShellCancellationCleansJobAndPrivateTemp",
              "TestWindowsPartialMountKeepsFileBoundaryAndAlwaysAsks",
              "TestWindowsReadOnlyMountOmitsFileMutations",
              "TestWindowsACLCLIProcessApprovalAndWriteBoundary",
              "TestWindowsWorkspaceReadListSearch",
              "TestWindowsWorkspaceRejectsPathAliases",
              "TestWindowsWorkspaceJunctionBoundaries",
              "TestWindowsWorkspaceReadBoundsAndCancellation",
              "TestWindowsWorkspaceTraversalBounds",
              "TestWindowsWorkspacePinnedRootIdentity",
              "TestWindowsWorkspaceSearchRootReplacement",
              "TestWindowsWorkspaceCreateNew",
              "TestWindowsWorkspaceCreateNeverReplaces",
              "TestWindowsWorkspaceCreateCancellationAndReceipts",
              "TestWindowsWorkspaceCreateRejectsRedirectsAndInvalidText",
              "TestWindowsFileCLIReadCreateApprovalBoundary",
              "TestCodingModelCLICombinedActivationWire/native-instructions=true",
          }
          events = [json.loads(line) for line in open(sys.argv[1], encoding="utf-8")]
          passed = {event.get("Test") for event in events if event.get("Action") == "pass"}
          skipped = [event.get("Test") for event in events if event.get("Action") == "skip"]
          missing = expected - passed
          if missing or skipped:
              raise SystemExit(f"Windows positive gate missing={sorted(missing)} skipped={skipped}")
          print(f"Verified all {len(expected)} required native Windows file/ACL contracts without skips")
          PYTEST

  ast:
    name: Official DSH AST comparison contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned AST parsers
        run: python -m pip install -r scripts/ast-compare/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Build pinned TypeScript grammar
        run: |
          npm ci --prefix scripts/ast-compare
          python scripts/ast-compare/build_typescript.py --cli scripts/ast-compare/node_modules/.bin/tree-sitter
      - name: Test AST contracts
        run: python -m unittest discover -s scripts/ast-compare -v
      - name: Checkout pinned official source for read-only comparison
        uses: actions/checkout@v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: f3803c96974ad4a94195fb97e5c637e9c2a3afe3
          path: .official-dsh-reference
          persist-credentials: false
      - name: Extract all selected official references
        run: |
          python scripts/ast-compare/references.py \
            --mapping scripts/ast-compare/mappings/official-dsh.json \
            --left-root .official-dsh-reference --right-root . \
            --json "$RUNNER_TEMP/official-dsh.json" \
            --markdown "$RUNNER_TEMP/official-dsh.md"

  generated:
    name: Fast generated contracts and CI runner contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node scripts/codegen/contracts.mjs --check
      - run: node --test scripts/ci/*.test.mjs tests/build/wasm-bindgen.mjs

  desktop-linux:
    name: Linux build and contracts
    uses: ./.github/workflows/desktop-check.yml
    with:
      os: ubuntu-latest
      upload-runtime: true

  desktop:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Build and contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    uses: ./.github/workflows/desktop-check.yml
    with:
      os: ${{ matrix.os }}

  desktop-acceptance:
    name: Desktop acceptance (${{ matrix.suite }})
    needs: desktop-linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('["workbench","toolcalls","data","data-product","control-lab","control-lab-app-use","control-lab-live","virtual-cell-comparison","virtual-cell-dataset-download","app-use","app-use-workbench","mcp-lifecycle","mcp-persistence","mcp-transport"]') || fromJSON('["workbench","data","app-use-workbench"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/control-lab/requirements.txt
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: desktop-runtime-${{ github.sha }}-Linux-X64
          path: ${{ runner.temp }}/desktop-runtime
      - name: Verify and restore same-revision runtime
        run: node scripts/ci/desktop-artifact.mjs unpack "$RUNNER_TEMP/desktop-runtime/desktop-runtime.tgz"
      - name: Install isolated display
        run: |
          sudo apt-get update
          sudo apt-get install --yes libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64 xvfb
      - name: Install real numerical engines
        if: startsWith(matrix.suite, 'control-lab')
        run: |
          sudo apt-get install --yes ngspice
          python -m venv "$RUNNER_TEMP/control-lab-python"
          "$RUNNER_TEMP/control-lab-python/bin/python" -m pip install --only-binary=:all: -r apps/control-lab/requirements.txt
      - name: Run independent acceptance with bounded cleanup
        env:
          PERO_TEST_HEADED: '1'
          PERO_TEST_SOFTWARE_GL: '1'
        run: node scripts/ci/desktop-suite.mjs '${{ matrix.suite }}'
      - name: Acceptance evidence including failure and timeout
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.suite }}-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  complete:
    name: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'Full-platform CI gate' || 'Linux CI gate' }}
    if: always()
    needs: [data, control-lab, virtual-cell, bazel, go, harness, harness-bazel, strict-sandbox, windows-acl-sandbox, ast, generated, desktop-linux, desktop, desktop-acceptance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require every contract and acceptance shard for this mode
        env:
          RESULTS: ${{ toJSON(needs) }}
          FULL_MATRIX: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: node scripts/ci/gate.mjs
