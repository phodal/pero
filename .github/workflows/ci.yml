# Toolchains follow the repo, not a compatibility matrix:
# Node.js 22 (desktop/README.md: 22.12+), npm from package-lock.json
# Rust stable, plus nightly-2026-10-28 for Wasm (scripts/build/wasm.mjs)
# gpui-kit ec89cfc (desktop/README.md, scripts/build/fonts.manifest.json)
# Go 1.26.4 (MODULE.bazel). server/go.mod's `go 1.24` is the language version.
# Bazel 9.2.0 (.bazelversion). pnpm-lock.yaml is the Bazel translation of the npm lock.
# PR/push runs Linux core contracts without Desktop compilation or GUI.
# Daily/manual/full-label retains every Desktop scenario and platform.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    - cron: "0 20 * * *" # 04:00 UTC+08; GitHub runs schedules on the default branch.
  workflow_dispatch:
    inputs:
      paper_html_live:
        description: "Opt in to three fixed public arXiv HTML parser checks (no PDF, images or model)"
        type: boolean
        default: false
      paper_pdf_live:
        description: "Opt in to public arXiv source and Google PDF journeys (no real model)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci:full' && github.run_id || 'active' }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && 'full' || 'linux' }}
  cancel-in-progress: ${{ !(github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full')) }}

defaults:
  run:
    shell: bash

jobs:
  scientific-viewer:
    name: Scientific Viewer browser inspection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/scientific-viewer/requirements.txt
      - name: Prepare pinned App and actual molecular engine
        run: |
          npm ci --ignore-scripts
          npm ci --prefix apps/scientific-viewer --ignore-scripts
          python -m pip install --only-binary=:all: -r apps/scientific-viewer/requirements.txt
          npx playwright install --with-deps chromium
          npm run build --prefix apps/scientific-viewer
      - name: Verify imported files, charts, molecules and responsive themes
        run: node tests/e2e/scientific-viewer-browser.mjs
      - name: Viewer screenshots and exact bundle evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scientific-viewer-browser-${{ github.sha }}
          path: test-results/scientific-viewer-browser/
          if-no-files-found: warn

  data:
    name: Data local catalog and download contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test opaque imports, bounded downloads and restart persistence
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s apps/data/test -p 'test_*.py' -v
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/data/package-lock.json
      - name: Install Data browser test dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix apps/data --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Check Data types and keyboard behavior in the real App frame
        run: |
          npm --prefix apps/data run typecheck
          npm --prefix apps/data run test:ui
          npm --prefix apps/data run test:browser
      - name: Upload Data browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: data-fields-browser
          path: test-results/data-fields/
          if-no-files-found: ignore

  lab:
    name: Lab real Chatterbox and evidence contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned no-hardware backend
        run: |
          python -m pip install --only-binary=:all: -r apps/lab/requirements.txt
      - name: Require real adapter, pure domain and authenticated evidence contracts
        env:
          LAB_REQUIRE_PLR: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s apps/lab/test -p 'test_*.py' -v
      - name: Reproduce published scoring math and constructed state-gate comparison
        run: |
          python apps/lab/benchmarks/paper_score.py --output test-results/lab-paper/paper-score.json
          python apps/lab/benchmarks/stateful_gate.py --output test-results/lab-paper/stateful-gate.json
      - name: Upload bounded software reproduction reports
        uses: actions/upload-artifact@v7
        with:
          name: lab-paper-software-${{ github.sha }}
          path: test-results/lab-paper/
          if-no-files-found: error
          retention-days: 7

  control-lab:
    name: Control Lab actual python-control and ngspice
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install real numerical engines
        run: |
          sudo apt-get update
          sudo apt-get install --yes ngspice
          python -m pip install --only-binary=:all: -r apps/control-lab/requirements.txt
          mkdir -p test-results/control-lab-science
          python -c 'import control; print(control.__version__)' | tee test-results/control-lab-science/python-control-version.txt
          ngspice --version | tee test-results/control-lab-science/ngspice-version.txt
      - name: Require both numerical engines and scientific contracts without dependency skips
        env:
          CONTROL_LAB_REQUIRE_SOLVERS: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s apps/control-lab/test -p 'test_*.py' -v 2>&1 | tee test-results/control-lab-science/tests.log
      - name: Numerical engine versions and scientific results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: control-lab-science-linux
          path: test-results/control-lab-science/
          if-no-files-found: warn
          retention-days: 7

  virtual-cell:
    name: Virtual Cell local comparison contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install preparation-test dependencies
        run: python -m pip install -r apps/virtual-cell/tools/norman/test-requirements.txt
      - name: Verify preparation tests cannot silently skip dependencies
        run: python -c 'import numpy, scipy'
      - name: Test scientific boundaries and local process lifecycle
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s apps/virtual-cell/test -p 'test_*.py' -v

  bazel:
    name: Bazel checks and server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && fromJSON('["ubuntu-latest","windows-latest","macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Windows Git would otherwise rewrite LF and change the Bazel lock hashes.
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: |
          git config --local core.autocrlf false
          git checkout -- .

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-version: 1.x
          bazelisk-cache: true
          repository-cache: true

      # rules_js cannot refresh the pnpm lock on Windows, and its text diffs are
      # byte compares that do not match the LF sources there. npm run check
      # still runs those generators on Windows in the desktop job.
      - name: Test generated checks
        if: runner.os != 'Windows'
        run: bazel test --config=ci //:checks

      - name: Build control plane
        run: bazel build //server/cmd/server

  go:
    name: Go tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && fromJSON('["ubuntu-latest","windows-latest","macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.4"
          cache-dependency-path: server/go.sum

      - name: Test
        working-directory: server
        run: go test -race ./...

  harness:
    name: Harness Go contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && fromJSON('["ubuntu-latest","windows-latest","macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache-dependency-path: harness/go/go.sum
      - name: Harness race tests
        working-directory: harness/go
        run: go test -race -count=1 ./...
      - name: Harness vet and build
        working-directory: harness/go
        run: |
          go vet ./...
          go build ./cmd/pero-agent-acp

  harness-bazel:
    name: Standalone harness Bazel contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: harness/go
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-version: 1.x
          bazelisk-cache: true
          repository-cache: true
      - name: Verify generated build declarations
        run: bazel run --lockfile_mode=error //:gazelle -- -mode=diff
      - name: Build standalone agent
        run: bazel build --lockfile_mode=error //cmd/pero-agent-acp
      - name: Test standalone contracts with race detector
        run: bazel test --lockfile_mode=error --@rules_go//go/config:race=true //...

  strict-sandbox:
    name: Positive Linux strict sandbox contract
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      GOWORK: "off"
      PERO_REQUIRE_STRICT_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache-dependency-path: harness/go/go.sum
      - name: Install supported sandbox backend
        timeout-minutes: 4
        run: |
          if command -v bwrap >/dev/null 2>&1; then
            bwrap --version
            exit 0
          fi
          # Avoid runner mirror outages and unrelated third-party repositories.
          codename="$(lsb_release --codename --short)"
          case "$codename" in
            jammy|noble) ;;
            *) echo "Unsupported Ubuntu release: $codename" >&2; exit 1 ;;
          esac
          sources="$RUNNER_TEMP/strict-sandbox.sources.list"
          printf '%s\n' \
            "deb https://archive.ubuntu.com/ubuntu $codename main universe" \
            "deb https://archive.ubuntu.com/ubuntu $codename-updates main universe" \
            "deb https://security.ubuntu.com/ubuntu $codename-security main universe" > "$sources"
          apt_options=(
            -o "Dir::Etc::sourcelist=$sources"
            -o 'Dir::Etc::sourceparts=-'
            -o 'Acquire::Retries=2'
            -o 'Acquire::http::Timeout=15'
            -o 'Acquire::https::Timeout=15'
            -o 'APT::Update::Error-Mode=any'
          )
          sudo timeout --kill-after=5s 90s apt-get "${apt_options[@]}" update
          sudo timeout --kill-after=5s 120s apt-get "${apt_options[@]}" install --yes --no-install-recommends bubblewrap
          bwrap --version
      - name: Require positive isolation contract
        working-directory: harness/go
        run: go test -count=1 -v ./sandbox -run '^TestNativeRuntime$'

  windows-acl-sandbox:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    name: Positive Windows file and partial ACL contracts
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GOWORK: "off"
      PERO_REQUIRE_WINDOWS_ACL: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Paper metadata worker lifecycle on Windows
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s apps/paper-agent/test -p test_research_import.py -v
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache-dependency-path: harness/go/go.sum
      # Explicitly authorized security tests: ACL/Low integrity edits apply only
      # to test-created temporary directories, never this checkout/user projects.
      - name: Require positive partial-boundary and lifecycle contracts
        working-directory: harness/go
        run: |
          go test -race -count=1 -json ./fstools ./sandbox ./shell ./nativetools ./cmd/pero-agent-acp -run "Windows|TestCodingModelCLICombinedActivationWire" | tee "$RUNNER_TEMP/windows-acl-results.jsonl"
          python - "$RUNNER_TEMP/windows-acl-results.jsonl" <<'PYTEST'
          import json, sys
          expected = {
              "TestWindowsACLRuntime",
              "TestWindowsACLJobLifecycle",
              "TestWindowsACLAmbientAndForeignRoots",
              "TestWindowsACLAdmissionBoundaries",
              "TestWindowsACLGrantRepairAndRevoke",
              "TestWindowsACLShellCancellationCleansJobAndPrivateTemp",
              "TestWindowsPartialMountKeepsFileBoundaryAndAlwaysAsks",
              "TestWindowsReadOnlyMountOmitsFileMutations",
              "TestWindowsACLCLIProcessApprovalAndWriteBoundary",
              "TestWindowsWorkspaceReadListSearch",
              "TestWindowsWorkspaceRejectsPathAliases",
              "TestWindowsWorkspaceJunctionBoundaries",
              "TestWindowsWorkspaceReadBoundsAndCancellation",
              "TestWindowsWorkspaceTraversalBounds",
              "TestWindowsWorkspacePinnedRootIdentity",
              "TestWindowsWorkspaceSearchRootReplacement",
              "TestWindowsWorkspaceCreateNew",
              "TestWindowsWorkspaceCreateNeverReplaces",
              "TestWindowsWorkspaceCreateCancellationAndReceipts",
              "TestWindowsWorkspaceCreateRejectsRedirectsAndInvalidText",
              "TestWindowsFileCLIReadCreateApprovalBoundary",
              "TestCodingModelCLICombinedActivationWire/native-instructions=true",
          }
          events = [json.loads(line) for line in open(sys.argv[1], encoding="utf-8")]
          passed = {event.get("Test") for event in events if event.get("Action") == "pass"}
          skipped = [event.get("Test") for event in events if event.get("Action") == "skip"]
          missing = expected - passed
          if missing or skipped:
              raise SystemExit(f"Windows positive gate missing={sorted(missing)} skipped={skipped}")
          print(f"Verified all {len(expected)} required native Windows file/ACL contracts without skips")
          PYTEST

  ast:
    name: Official DSH AST comparison contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned AST parsers
        run: python -m pip install -r scripts/ast-compare/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Build pinned TypeScript grammar
        run: |
          npm ci --prefix scripts/ast-compare
          python scripts/ast-compare/build_typescript.py --cli scripts/ast-compare/node_modules/.bin/tree-sitter
      - name: Test AST contracts
        run: python -m unittest discover -s scripts/ast-compare -v
      - name: Checkout pinned official source for read-only comparison
        uses: actions/checkout@v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: f3803c96974ad4a94195fb97e5c637e9c2a3afe3
          path: .official-dsh-reference
          persist-credentials: false
      - name: Extract all selected official references
        run: |
          python scripts/ast-compare/references.py \
            --mapping scripts/ast-compare/mappings/official-dsh.json \
            --left-root .official-dsh-reference --right-root . \
            --json "$RUNNER_TEMP/official-dsh.json" \
            --markdown "$RUNNER_TEMP/official-dsh.md"

  generated:
    name: Fast generated contracts and CI runner contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node scripts/codegen/contracts.mjs --check
      - run: node --test scripts/ci/*.test.mjs tests/build/wasm-bindgen.mjs tests/e2e/sidebar-controls.test.mjs tests/build/product-chat-startup.test.mjs tests/build/product-shutdown.test.mjs

  core:
    name: Linux core types, permissions and durable runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # Public path patches are manifest inputs, not a GPUI/Wasm compilation.
      - name: Checkout pinned GPUI manifest inputs
        run: |
          kit="$RUNNER_TEMP/gpui-kit"
          echo "PERO_GPUI_KIT_PATH=$kit" >> "$GITHUB_ENV"
          git init --quiet "$kit"
          git -C "$kit" config core.autocrlf false
          git -C "$kit" remote add origin https://github.com/longbridge/gpui-kit.git
          git -C "$kit" fetch --depth 1 origin ec89cfc36404667b7947aeb3d40b1c2859d729dd
          git -C "$kit" checkout --detach FETCH_HEAD
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/scientific-viewer/requirements.txt
      - name: Research references and Data download contracts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -c 'import json,subprocess,sys; dependencies=json.load(open("apps/paper-agent/app.json"))["backend"]["dependencies"]; subprocess.run([sys.executable,"-m","pip","install","--only-binary=:all:",*dependencies],check=True)'
          python -m unittest discover -s apps/paper-agent/test -p 'test_*.py' -v
          python tests/e2e/paper-pdf-http.py --output test-results/paper-pdf-http/fixture.json
          python tests/e2e/paper-source-http.py --output test-results/paper-source-http/fixture.json
          python tests/e2e/paper-source-cli.py --output test-results/paper-source-cli/fixture.json
          python -m unittest discover -s apps/data/test -v
      - name: Real local molecular backend contracts
        run: |
          python -m pip install --only-binary=:all: -r apps/scientific-viewer/requirements.txt
          python -m unittest discover -s apps/scientific-viewer/test -p 'test_*.py'
      - name: Independent App contracts with frozen dependencies
        run: |
          npm ci --prefix apps/hpc --ignore-scripts
          npm --prefix apps/hpc run test:ui
          npm ci --prefix apps/automations --ignore-scripts
          npm ci --prefix apps/paper-agent --ignore-scripts
          npm run typecheck --prefix apps/paper-agent
          node --test tests/e2e/paper-library-availability.test.mjs
          node --experimental-transform-types --test tests/e2e/paper-manual-evidence.test.ts
          node --test scripts/build/apps.test.mjs
          npm ci --prefix apps/scientific-viewer --ignore-scripts
          npm test --prefix apps/automations
          npm test --prefix apps/scientific-viewer
          npm run typecheck --prefix apps/automations
          npm run typecheck --prefix apps/scientific-viewer
      - name: Independent TypeScript and generated contracts
        run: |
          npx tsc -p scripts/ci/tsconfig.core.json
          node scripts/codegen/contracts.mjs --check
          node scripts/codegen/theme.mjs --check
          node scripts/codegen/design.mjs --check
          node scripts/check/locales.mjs
      - name: Core Rust without GPUI or WASM compilation
        run: |
          node scripts/cargo.mjs test --locked -p pero-contracts -p pero-runtime -p pero-host -p pero-worker
          node scripts/cargo.mjs build --locked -p pero-host -p pero-worker
      - name: Permission, cancellation and fixture contracts
        run: |
          npm run test:app-use:unit
          node --experimental-transform-types --test desktop/src/main/apps-research-assets.test.ts desktop/src/main/app-write-research-assets.test.ts desktop/src/main/apps-reproduction.test.ts
          node --test web/src/automation-model.test.ts tests/contracts/automation.test.mjs
          node --test web/src/host-connection.test.ts
          node --test desktop/src/main/{app-context,app-use,connector-secrets,content-artifacts,control-lab-goal,harness-environment,home,mcp-sources}.test.ts web/src/{automation-model,content-results}.test.ts
          node --test tests/fixtures/app-use-content.test.mjs tests/fixtures/app-use-progress.test.mjs tests/fixtures/app-chat-launch.test.mjs tests/fixtures/acp-agent.test.mjs tests/fixtures/owned-electron-close.test.mjs
          node --test tests/runtime/control-lab/*.test.mjs tests/runtime/control-lab/host-goal.test.ts
          node --test tests/runtime/lab/*.test.mjs
          node --experimental-transform-types --test tests/runtime/paper-study/*.test.mjs tests/runtime/research-import/cleanup.test.mjs
          node tests/e2e/computer-transport.mjs
      - name: Build the actual Host MCP sidecar and HTTP assets
        run: node scripts/build/mcp.mjs
      - name: Actual Host stdio and durable ownership
        run: |
          node tests/contracts/host.mjs
          node tests/contracts/research-import.mjs
          node tests/contracts/mcp-settings.mjs
          node tests/contracts/mcp-ownership.mjs
          node tests/runtime/automation.mjs
          node tests/runtime/automation-app.mjs
          PERO_HOST_EXECUTABLE="$PWD/target/debug/pero-host" node tests/contracts/app-agent-runs.mjs
      - name: Core failure and recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-contracts-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn

  desktop-linux:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    name: Linux build and contracts
    uses: ./.github/workflows/desktop-check.yml
    with:
      os: ubuntu-latest
      upload-runtime: true

  desktop:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    name: Build and contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    uses: ./.github/workflows/desktop-check.yml
    with:
      os: ${{ matrix.os }}

  desktop-acceptance:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    name: Desktop acceptance (${{ matrix.suite }})
    needs: desktop-linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [workbench, automation, toolcalls, data, data-product, control-lab, control-lab-app-use, control-lab-live, lab, virtual-cell-comparison, virtual-cell-dataset-download, app-use, app-use-workbench, mcp-lifecycle, mcp-persistence, mcp-transport, scientific-viewer, automations-ui, paper-research-import, paper-reading]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/control-lab/requirements.txt
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: desktop-runtime-${{ github.sha }}-Linux-X64
          path: ${{ runner.temp }}/desktop-runtime
      - name: Verify and restore same-revision runtime
        run: node scripts/ci/desktop-artifact.mjs unpack "$RUNNER_TEMP/desktop-runtime/desktop-runtime.tgz"
      - name: Install isolated display
        run: |
          sudo apt-get update
          sudo apt-get install --yes libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64 xvfb
      - name: Install real numerical engines
        if: startsWith(matrix.suite, 'control-lab')
        run: |
          sudo apt-get install --yes ngspice
          python -m venv "$RUNNER_TEMP/control-lab-python"
          "$RUNNER_TEMP/control-lab-python/bin/python" -m pip install --only-binary=:all: -r apps/control-lab/requirements.txt
      - name: Lab pinned no-hardware Python environment
        if: matrix.suite == 'lab'
        run: |
          python -m venv "$RUNNER_TEMP/lab-python"
          "$RUNNER_TEMP/lab-python/bin/python" -m pip install --only-binary=:all: -r apps/lab/requirements.txt
      - name: Lab frontend contracts
        if: matrix.suite == 'lab'
        run: |
          npm ci --prefix apps/lab
          npm --prefix apps/lab run typecheck
          node --test apps/lab/test/*.test.ts
      - name: Scientific Viewer real local molecular engine
        if: matrix.suite == 'scientific-viewer'
        run: |
          npm ci --prefix apps/scientific-viewer --ignore-scripts
          python -m venv "$RUNNER_TEMP/scientific-viewer-python"
          "$RUNNER_TEMP/scientific-viewer-python/bin/python" -m pip install --only-binary=:all: -r apps/scientific-viewer/requirements.txt
          "$RUNNER_TEMP/scientific-viewer-python/bin/python" -c 'import json,subprocess,sys; dependencies=json.load(open("apps/paper-agent/app.json"))["backend"]["dependencies"]; subprocess.run([sys.executable,"-m","pip","install","--only-binary=:all:",*dependencies],check=True)'
      - name: Paper research Python environment
        if: matrix.suite == 'paper-research-import' || matrix.suite == 'paper-reading'
        run: |
          npm ci --prefix apps/paper-agent --ignore-scripts
          python -m venv "$RUNNER_TEMP/paper-research-python"
          "$RUNNER_TEMP/paper-research-python/bin/python" -c 'import json,subprocess,sys; dependencies=json.load(open("apps/paper-agent/app.json"))["backend"]["dependencies"]; subprocess.run([sys.executable,"-m","pip","install","--only-binary=:all:",*dependencies],check=True)'
      - name: Browser for explicitly mocked App UI seams
        if: matrix.suite == 'automations-ui' || matrix.suite == 'paper-research-import' || matrix.suite == 'paper-reading'
        run: npx playwright install --with-deps chromium
      - name: Run independent acceptance with bounded cleanup
        env:
          PERO_TEST_HEADED: '1'
          PERO_TEST_SOFTWARE_GL: '1'
        run: node scripts/ci/desktop-suite.mjs '${{ matrix.suite }}'
      - name: Explicit public source study journey
        if: ${{ !cancelled() && matrix.suite == 'paper-research-import' && ((github.event_name == 'workflow_dispatch' && inputs.paper_pdf_live) || contains(github.event.pull_request.labels.*.name, 'ci:paper-pdf-live')) }}
        env:
          PERO_SOURCE_STUDY_LIVE: '1'
          PERO_TEST_HEADED: '1'
          PERO_TEST_SOFTWARE_GL: '1'
        run: |
          export PERO_APP_PYTHON="$RUNNER_TEMP/paper-research-python/bin/python"
          node scripts/ci/run-acceptance.mjs --name paper-source-live --timeout-seconds 180 -- xvfb-run -a -s '-screen 0 1920x1200x24' node tests/e2e/paper-source-study.mjs
      - name: Explicit public PDF study journey
        if: ${{ !cancelled() && matrix.suite == 'paper-research-import' && ((github.event_name == 'workflow_dispatch' && inputs.paper_pdf_live) || contains(github.event.pull_request.labels.*.name, 'ci:paper-pdf-live')) }}
        env:
          PERO_PDF_STUDY_LIVE: '1'
          PERO_TEST_HEADED: '1'
          PERO_TEST_SOFTWARE_GL: '1'
        run: |
          export PERO_APP_PYTHON="$RUNNER_TEMP/paper-research-python/bin/python"
          node scripts/ci/run-acceptance.mjs --name paper-pdf-live --timeout-seconds 180 -- xvfb-run -a -s '-screen 0 1920x1200x24' node tests/e2e/paper-pdf-study.mjs
      - name: Observe public TimesFM and HF metadata separately
        if: ${{ !cancelled() && matrix.suite == 'paper-research-import' }}
        timeout-minutes: 3
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python apps/paper-agent/test/manual/research_metadata.py --allow-public-metadata --output test-results/research-import/live-metadata.json
      - name: Acceptance evidence including failure and timeout
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.suite }}-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  paper-html-live:
    name: Paper fixed HTML (${{ matrix.corpus }})
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.paper_html_live) || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:paper-html-live')) }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        corpus: [d5, pc-gym, controlgym]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Acquire and parse only the selected fixed official HTML
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python apps/paper-agent/test/manual/scientific_html.py --allow-official-html --case ${{ matrix.corpus }} --output test-results/paper-html-live/${{ matrix.corpus }}.json
      - name: Upload metadata-only corpus result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paper-html-live-${{ matrix.corpus }}-${{ github.sha }}
          path: test-results/paper-html-live/${{ matrix.corpus }}.json
          if-no-files-found: error
          retention-days: 7

  complete:
    name: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && 'Full-platform CI gate' || 'Linux CI gate' }}
    if: always()
    needs: [paper-html-live, core, data, lab, control-lab, virtual-cell, scientific-viewer, bazel, go, harness, harness-bazel, strict-sandbox, windows-acl-sandbox, ast, generated, desktop-linux, desktop, desktop-acceptance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require every contract and acceptance shard for this mode
        env:
          RESULTS: ${{ toJSON(needs) }}
          PAPER_HTML_LIVE: ${{ (github.event_name == 'workflow_dispatch' && inputs.paper_html_live) || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:paper-html-live')) }}
          FULL_MATRIX: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: node scripts/ci/gate.mjs
