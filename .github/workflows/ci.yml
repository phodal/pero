# Toolchains follow the repo, not a compatibility matrix:
# Node.js 22 (desktop/README.md: 22.12+), npm from package-lock.json
# Rust stable, plus nightly-2026-10-28 for Wasm (scripts/build/wasm.mjs)
# gpui-kit 7591a35 (desktop/README.md)
# Go 1.26.4 (MODULE.bazel). server/go.mod's `go 1.26.0` is the language version.
# Bazel 9.2.0 (.bazelversion). pnpm-lock.yaml is the Bazel translation of the npm lock.
# A pull request or master push runs the Linux jobs below. Each called workflow
# has one job, so path-skipped work is one check and selected work is one check.
# Desktop, Windows, macOS, and opt-in Paper journeys are CI full. They are not
# pull_request jobs, because a skipped job still counts as a check.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    - cron: "0 20 * * *" # 04:00 UTC+08; GitHub runs schedules on the default branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci:full' && github.run_id || 'active' }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && 'full' || 'linux' }}
  cancel-in-progress: ${{ !(github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full')) }}

defaults:
  run:
    shell: bash

jobs:
  scope:
    name: Select affected App checks
    runs-on: ubuntu-latest
    outputs:
      scopes: ${{ steps.decide.outputs.scopes }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - id: decide
        env:
          SCOPE_KIND: ci
          SCOPE_EVENT: ${{ github.event_name }}
          SCOPE_LABELS: ${{ github.event_name == 'pull_request' && join(github.event.pull_request.labels.*.name, ',') || '' }}
          SCOPE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCOPE_HEAD: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}
        run: |
          files=""
          unknown=false
          if [[ "$SCOPE_EVENT" == "pull_request" || "$SCOPE_EVENT" == "push" ]]; then
            if git fetch --no-tags --depth=1 origin "${SCOPE_BASE}:refs/remotes/origin/pr-base" "${SCOPE_HEAD}:refs/remotes/origin/pr-head" && files=$(git diff --name-only --no-renames refs/remotes/origin/pr-base refs/remotes/origin/pr-head); then
              :
            else
              echo "Cannot read the diff; running all scoped checks." >&2
              unknown=true
            fi
          fi
          printf '%s\n' "$files" | SCOPE_UNKNOWN="$unknown" node scripts/ci/workflow-scope.mjs

  platform:
    name: Go tests and Bazel (ubuntu-latest)
    uses: ./.github/workflows/ci-platform.yml
    with:
      os: ubuntu-latest

  harness:
    name: Harness Go contracts (ubuntu-latest)
    uses: ./.github/workflows/ci-harness.yml
    with:
      os: ubuntu-latest

  strict-sandbox:
    name: Positive Linux strict sandbox contract
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      GOWORK: "off"
      PERO_REQUIRE_STRICT_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache-dependency-path: harness/go/go.sum
      - name: Install supported sandbox backend
        timeout-minutes: 4
        run: |
          if command -v bwrap >/dev/null 2>&1; then
            bwrap --version
            exit 0
          fi
          # Avoid runner mirror outages and unrelated third-party repositories.
          codename="$(lsb_release --codename --short)"
          case "$codename" in
            jammy|noble) ;;
            *) echo "Unsupported Ubuntu release: $codename" >&2; exit 1 ;;
          esac
          sources="$RUNNER_TEMP/strict-sandbox.sources.list"
          printf '%s\n' \
            "deb https://archive.ubuntu.com/ubuntu $codename main universe" \
            "deb https://archive.ubuntu.com/ubuntu $codename-updates main universe" \
            "deb https://security.ubuntu.com/ubuntu $codename-security main universe" > "$sources"
          apt_options=(
            -o "Dir::Etc::sourcelist=$sources"
            -o 'Dir::Etc::sourceparts=-'
            -o 'Acquire::Retries=2'
            -o 'Acquire::http::Timeout=15'
            -o 'Acquire::https::Timeout=15'
            -o 'APT::Update::Error-Mode=any'
          )
          sudo timeout --kill-after=5s 90s apt-get "${apt_options[@]}" update
          sudo timeout --kill-after=5s 120s apt-get "${apt_options[@]}" install --yes --no-install-recommends bubblewrap
          bwrap --version
      - name: Require positive isolation contract
        working-directory: harness/go
        run: go test -count=1 -v ./sandbox -run '^TestNativeRuntime$'

  campaign-temporal:
    name: Research Campaign recovery and reviewed PyBaMM rounds
    # setup-python publishes the locked 3.12.11 interpreter for this image.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_PASSWORD: campaign-fixture-only
          POSTGRES_USER: campaign_fixture
          POSTGRES_DB: campaign_fixture
        ports: [5432/tcp]
        options: >-
          --health-cmd "pg_isready -U campaign_fixture -d campaign_fixture"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.4"
          cache-dependency-path: server/go.sum
      - name: Verify restart, exact execution and history replay
        env:
          PERO_TEST_TEMPORAL: '1'
          PERO_REQUIRE_TEST_DATABASE: '1'
          PERO_TEST_DATABASE_URL: postgresql://campaign_fixture:campaign-fixture-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/campaign_fixture?sslmode=disable
          TMPDIR: ${{ runner.temp }}
        run: go -C server test -race -count=1 -v ./internal/httpapi -run '^(TestResearchCampaignTemporal|TestReviewedCampaignInventory|TestProductionServerKeepsAPaperAndARunReceipt)$'
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.11"
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the control plane, orchestrator and real Worker
        run: |
          export PERO_GPUI_KIT_PATH="$RUNNER_TEMP/gpui-kit"
          bash scripts/ci/checkout-public-pin.sh "$PERO_GPUI_KIT_PATH" https://github.com/longbridge/gpui-kit.git 7591a35eced761e3613c01e71ff04c10129dae1a
          node scripts/cargo.mjs build --locked -p pero-worker
          go -C server build -o "$RUNNER_TEMP/pero-server" ./cmd/server
          go -C server build -o "$RUNNER_TEMP/pero-campaign" ./cmd/pero-campaign
      - name: Build the real Desktop Workbench
        run: |
          export PERO_GPUI_KIT_PATH="$RUNNER_TEMP/gpui-kit"
          sudo apt-get update
          sudo apt-get install -y xvfb pkg-config libfontconfig1-dev
          npm ci
          npm ci --prefix packages/connectors --ignore-scripts
          node scripts/cargo.mjs build --locked -p pero-host
          node scripts/build/wasm.mjs
          npm run build --workspace @pero/web
          node scripts/build/desktop.mjs
          npx playwright install --with-deps chromium
      - name: Approve the second PyBaMM round in Desktop and replay the Workflow
        env:
          PERO_TEST_DATABASE_URL: postgresql://campaign_fixture:campaign-fixture-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/campaign_fixture?sslmode=disable
          PERO_TEST_HEADED: '1'
          PERO_TEST_SOFTWARE_GL: '1'
        run: |
          command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          python -m venv "$RUNNER_TEMP/pybamm"
          "$RUNNER_TEMP/pybamm/bin/python" -m pip install --only-binary=:all: --no-deps -r scripts/science/pybamm-sweep/requirements.lock
          xvfb-run -a python scripts/science/pybamm-sweep/campaign_acceptance.py \
            --database "$PERO_TEST_DATABASE_URL" --server "$RUNNER_TEMP/pero-server" \
            --orchestrator "$RUNNER_TEMP/pero-campaign" --worker "$PWD/target/debug/pero-worker" \
            --temporal "$RUNNER_TEMP/temporal-cli-v1.10.1" --python "$RUNNER_TEMP/pybamm/bin/python" \
            --checker-python "$(command -v python)" --output "$RUNNER_TEMP/reviewed-pybamm" \
            --desktop-review "$PWD/tests/e2e/campaign-review.mjs"
          PERO_TEST_REVIEW_HISTORY="$RUNNER_TEMP/reviewed-pybamm/history.json" \
            go -C server test ./internal/campaignruntime -run '^TestReplayCampaignV2$'
      - name: Retain exact Run and verification receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reviewed-pybamm-receipts
          path: |
            ${{ runner.temp }}/reviewed-pybamm/receipt.json
            ${{ runner.temp }}/reviewed-pybamm/history.json
            ${{ runner.temp }}/reviewed-pybamm/*.png
            ${{ runner.temp }}/reviewed-pybamm/desktop-review.log
          if-no-files-found: ignore

  core:
    needs: scope
    env:
      NOTEBOOK_PYTHON: ${{ fromJSON(needs.scope.outputs.scopes)['notebook-python'] }}
      NOTEBOOK_CANVAS: ${{ fromJSON(needs.scope.outputs.scopes)['notebook-canvas'] }}
      MCP_BROWSER: ${{ fromJSON(needs.scope.outputs.scopes)['mcp-browser'] }}
      FISHER: ${{ fromJSON(needs.scope.outputs.scopes)['fisher'] }}
    name: Linux core types, permissions and durable runtime
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        id: checkout
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
        id: node
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
      - name: Install root dependencies
        id: npm
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: npm ci
      - name: Core TypeScript
        id: core_types
        if: ${{ !cancelled() && steps.npm.outcome == 'success' }}
        run: npx tsc -p scripts/ci/tsconfig.core.json
      - name: Generated protocol contracts
        id: generated_protocol
        if: ${{ !cancelled() && steps.npm.outcome == 'success' }}
        run: node scripts/codegen/contracts.mjs --check
      - name: Generated theme
        id: generated_theme
        if: ${{ !cancelled() && steps.npm.outcome == 'success' }}
        run: node scripts/codegen/theme.mjs --check
      - name: Generated design
        id: generated_design
        if: ${{ !cancelled() && steps.npm.outcome == 'success' }}
        run: node scripts/codegen/design.mjs --check
      - name: Locale contracts
        id: locales
        if: ${{ !cancelled() && steps.npm.outcome == 'success' }}
        run: node scripts/check/locales.mjs
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
        id: rust
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
        id: cargo_cache
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
      - name: Checkout pinned GPUI manifest inputs
        run: |
          kit="$RUNNER_TEMP/gpui-kit"
          echo "PERO_GPUI_KIT_PATH=$kit" >> "$GITHUB_ENV"
          bash scripts/ci/checkout-public-pin.sh "$kit" https://github.com/longbridge/gpui-kit.git 7591a35eced761e3613c01e71ff04c10129dae1a
        id: gpui
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/scientific-viewer/requirements.txt
        id: python
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
      - name: Install pinned Paper backend dependencies
        id: paper_python
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: |
          node scripts/build/source-parsers.mjs
          node scripts/build/scientific-runtime.mjs
          python -c 'import json,subprocess,sys; dependencies=json.load(open("apps/paper-agent/app.json"))["backend"]["dependencies"]; subprocess.run([sys.executable,"-m","pip","install","--only-binary=:all:",*dependencies],check=True)'
      - name: Prepare pinned Notebook Canvas Python environment
        id: notebook_canvas_python
        if: ${{ !cancelled() && steps.python.outcome == 'success' && steps.node.outcome == 'success' && env.NOTEBOOK_PYTHON == 'true' }}
        run: |
          node scripts/build/source-parsers.mjs
          python -m venv "$RUNNER_TEMP/notebook-canvas-python"
          "$RUNNER_TEMP/notebook-canvas-python/bin/python" -c 'import json,subprocess,sys; dependencies=json.load(open("apps/notebook/app.json"))["backend"]["dependencies"]; subprocess.run([sys.executable,"-m","pip","install","--only-binary=:all:",*dependencies],check=True)'
      - name: Paper backend contracts
        id: paper_backend
        if: ${{ !cancelled() && steps.paper_python.outcome == 'success' }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s apps/paper-agent/test -p 'test_*.py' -v
      - name: Offline research-quality scoring contracts
        id: research_quality_python
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: python -m unittest discover -s tests/runtime -p 'test_research_quality.py' -v
      - name: Offline Worker acceptance and frozen-method contracts
        id: worker_acceptance_python
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: python -m unittest discover -s scripts/science/pybamm-sweep -p 'test_*.py' -v
      - name: Paper PDF HTTP contracts
        id: paper_pdf_http
        if: ${{ !cancelled() && steps.paper_python.outcome == 'success' }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tests/e2e/paper-pdf-http.py --output test-results/paper-pdf-http/fixture.json
      - name: Paper source HTTP contracts
        id: paper_source_http
        if: ${{ !cancelled() && steps.paper_python.outcome == 'success' }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tests/e2e/paper-source-http.py --output test-results/paper-source-http/fixture.json
      - name: Paper source CLI contracts
        id: paper_source_cli
        if: ${{ !cancelled() && steps.paper_python.outcome == 'success' }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tests/e2e/paper-source-cli.py --output test-results/paper-source-cli/fixture.json
      - name: Data backend contracts
        id: data_backend
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s apps/data/test -v
      - name: Install pinned molecular backend
        id: viewer_python
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: "python -m pip install --only-binary=:all: -r apps/scientific-viewer/requirements.txt"
      - name: Molecular backend contracts
        id: viewer_backend
        if: ${{ !cancelled() && steps.viewer_python.outcome == 'success' }}
        run: python -m unittest discover -s apps/scientific-viewer/test -p 'test_*.py'
      - name: Install locked hpc dependencies
        id: hpc_npm
        if: ${{ !cancelled() && steps.npm.outcome == 'success' }}
        run: npm ci --prefix apps/hpc --ignore-scripts
      - name: Install locked automations dependencies
        id: automations_npm
        if: ${{ !cancelled() && steps.npm.outcome == 'success' }}
        run: npm ci --prefix apps/automations --ignore-scripts
      - name: Install locked paper-agent dependencies
        id: paper_npm
        if: ${{ !cancelled() && steps.npm.outcome == 'success' }}
        run: npm ci --prefix apps/paper-agent --ignore-scripts
      - name: Install locked scientific-viewer dependencies
        id: viewer_npm
        if: ${{ !cancelled() && steps.npm.outcome == 'success' }}
        run: npm ci --prefix apps/scientific-viewer --ignore-scripts
      - name: HPC UI contracts
        id: hpc_ui
        if: ${{ !cancelled() && steps.hpc_npm.outcome == 'success' }}
        run: npm --prefix apps/hpc run test:ui
      - name: Paper setup and numeric component contracts
        id: paper_components
        if: ${{ !cancelled() && steps.paper_npm.outcome == 'success' }}
        run: node --test apps/paper-agent/test/docling-runtime.test.mjs apps/paper-agent/test/numeric-values.test.mjs apps/paper-agent/test/workspace-ui.test.mjs
      - name: Paper TypeScript
        id: paper_types
        if: ${{ !cancelled() && steps.paper_npm.outcome == 'success' }}
        run: npm run typecheck --prefix apps/paper-agent
      - name: Paper availability contracts
        id: paper_availability
        if: ${{ !cancelled() && steps.paper_npm.outcome == 'success' }}
        run: node --test tests/e2e/paper-library-availability.test.mjs
      - name: Paper manual evidence contracts
        id: paper_manual
        if: ${{ !cancelled() && steps.paper_npm.outcome == 'success' }}
        run: node --experimental-transform-types --test tests/e2e/paper-manual-evidence.test.ts
      - name: App build contracts
        id: app_build_contracts
        if: ${{ !cancelled() && steps.paper_npm.outcome == 'success' }}
        run: node --test scripts/build/apps.test.mjs
      - name: Automations unit contracts
        id: automations_unit
        if: ${{ !cancelled() && steps.automations_npm.outcome == 'success' }}
        run: npm test --prefix apps/automations
      - name: Viewer unit contracts
        id: viewer_unit
        if: ${{ !cancelled() && steps.viewer_npm.outcome == 'success' }}
        run: npm test --prefix apps/scientific-viewer
      - name: Automations TypeScript
        id: automations_types
        if: ${{ !cancelled() && steps.automations_npm.outcome == 'success' }}
        run: npm run typecheck --prefix apps/automations
      - name: Viewer TypeScript
        id: viewer_types
        if: ${{ !cancelled() && steps.viewer_npm.outcome == 'success' }}
        run: npm run typecheck --prefix apps/scientific-viewer
      - name: Core Rust tests without GPUI or WASM compilation
        id: rust_tests
        if: ${{ !cancelled() && steps.node.outcome == 'success' && steps.rust.outcome == 'success' && steps.gpui.outcome == 'success' }}
        run: node scripts/cargo.mjs test --locked -p pero-contracts -p pero-runtime -p pero-host -p pero-worker -p pero-ui -p pero-chat-ui -p pero-theme
      - name: Build Host and Worker binaries
        id: host_build
        if: ${{ !cancelled() && steps.node.outcome == 'success' && steps.rust.outcome == 'success' && steps.gpui.outcome == 'success' }}
        run: node scripts/cargo.mjs build --locked -p pero-host -p pero-worker
      - name: Declared Canvas real Host and owner recovery contracts
        id: app_canvas
        if: ${{ !cancelled() && steps.host_build.outcome == 'success' && steps.notebook_canvas_python.outcome == 'success' && env.NOTEBOOK_CANVAS == 'true' }}
        env:
          PERO_APP_PYTHON: ${{ runner.temp }}/notebook-canvas-python/bin/python
        run: node tests/contracts/app-canvas.mjs
      - name: App use authorization contracts
        id: app_use
        if: ${{ !cancelled() && steps.npm.outcome == 'success' }}
        run: npm run test:app-use:unit
      - name: Research asset authorization contracts
        id: research_assets
        if: ${{ !cancelled() && steps.npm.outcome == 'success' }}
        run: node --experimental-transform-types --test desktop/src/main/apps-research-assets.test.ts desktop/src/main/app-write-research-assets.test.ts desktop/src/main/apps-reproduction.test.ts
      - name: Automation model contracts
        id: automation_model
        if: ${{ !cancelled() && steps.npm.outcome == 'success' }}
        run: node --test web/src/automation-model.test.ts tests/contracts/automation.test.mjs
      - name: Host connection contracts
        id: host_connection
        if: ${{ !cancelled() && steps.npm.outcome == 'success' }}
        run: node --test web/src/host-connection.test.ts web/src/mcp-settings-bridge.test.ts web/src/canvas-focus.test.ts
      - name: Desktop content and connector contracts
        id: desktop_content
        if: ${{ !cancelled() && steps.npm.outcome == 'success' }}
        run: node --test desktop/src/main/{connector-secrets,content-artifacts,harness-environment,home,mcp-sources}.test.ts web/src/content-results.test.ts
      - name: ACP and lifecycle fixture contracts
        id: fixtures
        if: ${{ !cancelled() && steps.npm.outcome == 'success' }}
        run: node --test tests/fixtures/app-use-content.test.mjs tests/fixtures/app-use-progress.test.mjs tests/fixtures/app-chat-launch.test.mjs tests/fixtures/acp-agent.test.mjs tests/fixtures/owned-electron-close.test.mjs tests/runtime/agent-background.test.mjs
      - name: Control Lab runtime contracts
        id: control_lab
        if: ${{ !cancelled() && steps.npm.outcome == 'success' }}
        run: |
          shopt -s extglob
          node --test tests/runtime/control-lab/!(host-*).test.mjs
      - name: Control Lab Host launch and goal contracts
        id: control_lab_host
        if: ${{ !cancelled() && steps.npm.outcome == 'success' && steps.host_build.outcome == 'success' }}
        run: node --test tests/runtime/control-lab/host-*.test.mjs tests/runtime/control-lab/host-goal.test.ts
      - name: Lab runtime contracts
        id: lab_runtime
        if: ${{ !cancelled() && steps.npm.outcome == 'success' }}
        run: node --test tests/runtime/lab/*.test.mjs
      - name: Paper source campaign contracts
        id: paper_campaign
        if: ${{ !cancelled() && steps.npm.outcome == 'success' }}
        run: node --experimental-transform-types --test tests/runtime/paper-study/*.test.mjs tests/runtime/research-import/cleanup.test.mjs
      - name: Computer transport contracts
        id: computer_transport
        if: ${{ !cancelled() && steps.npm.outcome == 'success' }}
        run: node tests/e2e/computer-transport.mjs
      - name: Build the actual Host MCP sidecar and HTTP assets
        id: mcp_build
        if: ${{ !cancelled() && steps.npm.outcome == 'success' }}
        run: node scripts/build/mcp.mjs
      - name: Host stdio contracts
        id: host_stdio
        if: ${{ !cancelled() && steps.npm.outcome == 'success' && steps.host_build.outcome == 'success' }}
        run: node tests/contracts/host.mjs
      - name: Host research import contracts
        id: host_research
        if: ${{ !cancelled() && steps.npm.outcome == 'success' && steps.host_build.outcome == 'success' && steps.paper_python.outcome == 'success' }}
        run: node tests/contracts/research-import.mjs
      - name: Host MCP settings contracts
        id: host_mcp_settings
        if: ${{ !cancelled() && steps.npm.outcome == 'success' && steps.host_build.outcome == 'success' && steps.mcp_build.outcome == 'success' }}
        run: node tests/contracts/mcp-settings.mjs
      - name: Host MCP Apps browser acceptance
        id: mcp_browser
        if: ${{ !cancelled() && steps.npm.outcome == 'success' && steps.host_build.outcome == 'success' && steps.mcp_build.outcome == 'success' && steps.notebook_canvas_python.outcome == 'success' && env.MCP_BROWSER == 'true' }}
        run: |
          node scripts/build/harness.mjs
          npx playwright install --with-deps chromium
          node --experimental-transform-types tests/contracts/mcp-session-panel.mjs --browser
          npm run test:mcp-official -- --install
          npm run test:mcp-app-sdk
          PERO_MCP_BROWSER=1 PERO_APP_PYTHON="$RUNNER_TEMP/notebook-canvas-python/bin/python" npm run test:mcp-apps
      - name: Host MCP ownership contracts
        id: host_mcp_ownership
        if: ${{ !cancelled() && steps.npm.outcome == 'success' && steps.host_build.outcome == 'success' && steps.mcp_build.outcome == 'success' }}
        run: node tests/contracts/mcp-ownership.mjs
      - name: Host automation contracts
        id: host_automation
        if: ${{ !cancelled() && steps.npm.outcome == 'success' && steps.host_build.outcome == 'success' }}
        run: node tests/runtime/automation.mjs
      - name: Host App automation contracts
        id: host_app_automation
        if: ${{ !cancelled() && steps.npm.outcome == 'success' && steps.host_build.outcome == 'success' }}
        run: node tests/runtime/automation-app.mjs
      - name: Host App agent run contracts
        id: host_app_agent
        if: ${{ !cancelled() && steps.npm.outcome == 'success' && steps.host_build.outcome == 'success' }}
        run: PERO_HOST_EXECUTABLE="$PWD/target/debug/pero-host" node tests/contracts/app-agent-runs.mjs
      - name: Fast generated contracts and CI runner contracts
        id: fast_contracts
        if: ${{ !cancelled() && steps.npm.outcome == 'success' && steps.paper_npm.outcome == 'success' }}
        run: |
          node --test scripts/ci/*.test.mjs tests/build/wasm-bindgen.mjs tests/e2e/sidebar-controls.test.mjs packages/app-sdk/test/select.test.mjs tests/build/product-chat-startup.test.mjs tests/build/product-shutdown.test.mjs
          node --test tests/runtime/research-quality/*.test.mjs
          node --experimental-vm-modules --test tests/build/native-dev.test.mjs
      - name: Install pinned AST parsers
        id: ast_install
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: python -m pip install -r scripts/ast-compare/requirements.txt
      - name: Build pinned TypeScript grammar
        id: ast_grammar
        if: ${{ !cancelled() && steps.python.outcome == 'success' && steps.npm.outcome == 'success' }}
        run: |
          npm ci --prefix scripts/ast-compare
          python scripts/ast-compare/build_typescript.py --cli scripts/ast-compare/node_modules/.bin/tree-sitter
      - name: Test AST contracts
        id: ast_tests
        if: ${{ !cancelled() && steps.python.outcome == 'success' && steps.npm.outcome == 'success' }}
        run: python -m unittest discover -s scripts/ast-compare -v
      - name: Checkout pinned official source for read-only comparison
        id: official_dsh
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions/checkout@v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: f3803c96974ad4a94195fb97e5c637e9c2a3afe3
          path: .official-dsh-reference
          persist-credentials: false
      - name: Compare actual official Skill catalog hook
        id: official_catalog
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          FULL_CATALOG: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          if [[ "$FULL_CATALOG" != true ]]; then
            echo "Official catalog comparison runs on schedule, manual CI, or ci:full."
            exit 0
          fi
          node scripts/harness/compare-skill-catalog.mjs .official-dsh-reference/packages/skill/tool-skill/src/index.ts > "$RUNNER_TEMP/official-skill-catalog.json"
      - name: Retain official Skill hook receipts
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full'))
        uses: actions/upload-artifact@v7
        with:
          name: official-skill-catalog
          path: ${{ runner.temp }}/official-skill-catalog.json
          if-no-files-found: warn
      - name: Extract all selected official references
        id: official_extract
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          python scripts/ast-compare/references.py \
            --mapping scripts/ast-compare/mappings/official-dsh.json \
            --left-root .official-dsh-reference --right-root . \
            --json "$RUNNER_TEMP/official-dsh.json" \
            --markdown "$RUNNER_TEMP/official-dsh.md"
      - name: Paper Fisher public scan and browser contracts
        id: fisher
        if: ${{ !cancelled() && steps.paper_npm.outcome == 'success' && steps.paper_python.outcome == 'success' && env.FISHER == 'true' }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: apps/paper-agent/backend
          PERO_FISHER_PDF: /tmp/pero-fisher1936.pdf
        run: |
          npx playwright install --with-deps chromium
          python - <<'PY'
          import hashlib, os, urllib.request
          from pathlib import Path
          from paper_agent.fisher_result import PDF_URL, PDF_SHA256
          with urllib.request.urlopen(PDF_URL, timeout=30) as response:
              data = response.read(20_000_001)
          assert len(data) <= 20_000_000 and hashlib.sha256(data).hexdigest() == PDF_SHA256
          Path(os.environ['PERO_FISHER_PDF']).write_bytes(data)
          PY
          npm --prefix apps/paper-agent run typecheck
          python -m unittest discover -s apps/paper-agent/test -p 'test_fisher*.py' -v
          node tests/e2e/paper-fisher-state.mjs
          node tests/e2e/paper-fisher-component.mjs
          node tests/e2e/paper-fisher-browser.mjs
      - name: Core failure and recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-contracts-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn

  notebook:
    needs: scope
    if: fromJSON(needs.scope.outputs.scopes)['notebook']
    name: Notebook revisions, workbook and browser contracts
    uses: ./.github/workflows/ci-notebook.yml
    with:
      suite: notebook

  scientific-viewer:
    needs: scope
    if: fromJSON(needs.scope.outputs.scopes)['scientific-viewer']
    name: Scientific Viewer browser inspection
    uses: ./.github/workflows/ci-scientific-viewer.yml
    with:
      suite: scientific-viewer

  lcms2yield:
    needs: scope
    if: fromJSON(needs.scope.outputs.scopes)['lcms2yield']
    name: LCMS2Yield input and browser contracts
    uses: ./.github/workflows/ci-lcms2yield.yml
    with:
      suite: lcms2yield

  data:
    needs: scope
    if: fromJSON(needs.scope.outputs.scopes)['data']
    name: Data local catalog and download contracts
    uses: ./.github/workflows/ci-data.yml
    with:
      suite: data

  lab:
    needs: scope
    if: fromJSON(needs.scope.outputs.scopes)['lab']
    name: Lab real Chatterbox and evidence contracts
    uses: ./.github/workflows/ci-lab.yml
    with:
      suite: lab

  control-lab:
    needs: scope
    if: fromJSON(needs.scope.outputs.scopes)['control-lab']
    name: Control Lab actual python-control and ngspice
    uses: ./.github/workflows/ci-control-lab.yml
    with:
      suite: control-lab

  virtual-cell:
    needs: scope
    if: fromJSON(needs.scope.outputs.scopes)['virtual-cell']
    name: Virtual Cell local comparison contracts
    uses: ./.github/workflows/ci-virtual-cell.yml
    with:
      suite: virtual-cell

  notebook-canvas:
    needs: scope
    if: fromJSON(needs.scope.outputs.scopes)['notebook-canvas']
    name: Notebook Canvas real Host browser acceptance
    uses: ./.github/workflows/ci-notebook-canvas.yml
    with:
      suite: notebook-canvas

  native-ui:
    needs: scope
    if: fromJSON(needs.scope.outputs.scopes)['native-ui']
    name: Native shell compilation and unit contracts
    uses: ./.github/workflows/ci-native.yml
    with:
      suite: native-ui

  mcp-browser:
    needs: scope
    if: fromJSON(needs.scope.outputs.scopes)['mcp-browser']
    name: Official MCP conversation history
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Checkout pinned GPUI manifest inputs
        run: |
          kit="$RUNNER_TEMP/gpui-kit"
          echo "PERO_GPUI_KIT_PATH=$kit" >> "$GITHUB_ENV"
          bash scripts/ci/checkout-public-pin.sh "$kit" https://github.com/longbridge/gpui-kit.git 7591a35eced761e3613c01e71ff04c10129dae1a
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.4"
      - name: Install Electron and font build libraries
        run: sudo apt-get update && sudo apt-get install -y python3-venv xvfb pkg-config libfontconfig1-dev
      - name: Build Host, Harness, Wasm, Workbench and Desktop
        run: |
          node scripts/cargo.mjs build --locked -p pero-host
          node scripts/build/harness.mjs
          node scripts/build/wasm.mjs
          npm run build --workspace @pero/web
          npm ci --prefix packages/connectors --ignore-scripts
          node scripts/build/desktop.mjs
      - name: Official conversation, including same-process close and restart
        run: |
          npx playwright install --with-deps chromium
          npm install --prefix target/mcp-official-example --save-exact --ignore-scripts --no-audit --no-fund @modelcontextprotocol/server-basic-vanillajs@2.0.4
          xvfb-run -a env PERO_TEST_SOFTWARE_GL=1 npm run test:mcp-official-conversation
          xvfb-run -a env PERO_TEST_SOFTWARE_GL=1 npm run test:mcp-notebook-conversation
      - name: Upload conversation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mcp-conversation-${{ github.sha }}
          path: |
            test-results/mcp-apps-conversation/
            test-results/mcp-notebook-conversation/
          if-no-files-found: warn

  complete:
    name: Linux CI gate
    if: always()
    needs: [scope, platform, harness, strict-sandbox, campaign-temporal, core, notebook, scientific-viewer, lcms2yield, data, lab, control-lab, virtual-cell, notebook-canvas, native-ui, mcp-browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require every contract and acceptance shard for this mode
        env:
          RESULTS: ${{ toJSON(needs) }}
          SCOPES: ${{ needs.scope.outputs.scopes }}
          PAPER_HTML_LIVE: 'false'
          FULL_MATRIX: 'false'
        run: node scripts/ci/gate.mjs
