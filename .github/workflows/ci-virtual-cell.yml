name: CI virtual-cell

# Reusable jobs only: all automatic triggers and required gates stay in CI.
on:
  workflow_call:
    inputs:
      suite:
        description: CI-owned job family
        type: string
        required: true
      os:
        type: string
        default: ubuntu-latest
      upload-runtime:
        type: boolean
        default: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  virtual-cell:
    if: inputs.suite == 'virtual-cell'
    name: Virtual Cell local comparison contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install preparation-test dependencies
        run: python -m pip install -r apps/virtual-cell/tools/norman/test-requirements.txt
      - name: Verify preparation tests cannot silently skip dependencies
        run: python -c 'import numpy, scipy'
      - name: Test scientific boundaries and local process lifecycle
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s apps/virtual-cell/test -p 'test_*.py' -v
