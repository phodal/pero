<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Protocol harness</title>
</head>
<body>
  <main>
    <h1>Protocol harness</h1>
    <p>Scoped client token only. This page does not ask for an operator credential.</p>
    <form id="session">
      <label>Origin <input name="origin" required value="http://127.0.0.1:8080"></label>
      <label>Project <input name="project" required value="lab"></label>
      <label>Client token <input name="token" required autocomplete="off"></label>
      <label>PDF <input name="pdf" type="file" accept="application/pdf"></label>
      <button type="submit">Run slice</button>
    </form>
    <pre id="result"></pre>
  </main>
  <script type="module">
    import { runProtocolSlice } from './session.mjs';

    const result = document.querySelector('#result');
    document.querySelector('#session').addEventListener('submit', async (event) => {
      event.preventDefault();
      const data = new FormData(event.currentTarget);
      const file = data.get('pdf');
      const corpus = {
        project: data.get('project'),
        clientToken: data.get('token'),
        ownerHost: 'paper-owner',
        localProject: 'local-lab',
        app: 'paper-agent',
        appInstance: 'paper-agent@paper-owner',
        appVersion: '1',
        paperId: 'paper-1',
        revision: '34ad712113ddbb4f4c4dc5f46380924a5ff69f53e0e5bc1b63e03c5bb6d44f90',
        evidence: 'pero-paper-evidence-v1',
        pdf: '%PDF-1.1\n1 0 obj<<>>endobj\ntrailer<<>>\n%%EOF\n',
        runId: 'run-1',
        runOwner: 'control-plane',
      };
      const picked = file && file.size ? new Uint8Array(await file.arrayBuffer()) : undefined;
      try {
        const slice = await runProtocolSlice({ origin: data.get('origin'), corpus, pdfBytes: picked });
        result.textContent = JSON.stringify({
          role: slice.me.role,
          opened: slice.opened.digest,
          paperId: slice.first.paperId,
          createdAgain: slice.second.created,
          run: slice.observed.outcome,
          disconnect: slice.disconnected.outcome,
          replay: slice.replay.outcome,
        }, null, 2);
      } catch (error) {
        result.textContent = error.code || error.message;
      }
    });
  </script>
</body>
</html>
