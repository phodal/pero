[package]
name = "pero-ui"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
native-probe = ["native"]
native = ["pero-theme/native", "pero-chat-ui/native", "dep:gpui-kit", "dep:anyhow", "dep:async-channel", "dep:chrono", "dep:sha2", "dep:hmac", "dep:getrandom", "dep:reqwest", "dep:url", "dep:gpui-webview", "dep:wry", "dep:webkit2gtk", "dep:percent-encoding", "dep:mime_guess"]

[[bin]]
name = "pero-native"
path = "src/native_main.rs"
required-features = ["native"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pero-contracts.workspace = true
pero-theme.workspace = true
pero-chat-ui.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
gpui-kit = { workspace = true, features = ["syntect"] }
wasm-bindgen = "=0.2.127"
js-sys = "0.3"
console_error_panic_hook = "0.1"
anyhow = "1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
gpui-kit = { workspace = true, features = ["syntect", "gpui-fast"], optional = true }
anyhow = { version = "1", optional = true }
async-channel = { version = "2", optional = true }
chrono = { version = "0.4", optional = true }
sha2 = { version = "0.10", optional = true }
hmac = { version = "0.12", optional = true }
getrandom = { version = "0.2", optional = true }
percent-encoding = { version = "2", optional = true }
mime_guess = { version = "2", optional = true }
gpui-webview = {version="=0.8.1",features=["gpui-fast"],optional=true}
wry = {package="lb-wry",version="=0.53.3",optional=true}
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
url = { version = "2.5", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
objc2 = "=0.6.5"
raw-window-handle = "=0.6.2"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = {version="=2.0.1",optional=true}
