[package]
name = "pero-chat-ui"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
native = ["pero-theme/native", "dep:gpui-kit"]

[dependencies]
pero-contracts.workspace = true
pero-theme.workspace = true
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
anyhow = "1"

[target.'cfg(target_family = "wasm")'.dependencies]
gpui-kit = { workspace = true, features = ["syntect"] }
js-sys = "0.3"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
gpui-kit = { workspace = true, features = ["syntect"], optional = true }
