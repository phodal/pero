server {
    listen 80;
    server_name app.openpero.com;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://app.openpero.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name app.openpero.com;
    ssl_certificate /etc/letsencrypt/live/app.openpero.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.openpero.com/privkey.pem;
    access_log off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:18796;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        client_max_body_size 512k;
    }
}
