[package]
name = "pero-computer"
version = "0.1.0"
edition = "2024"
publish = false

# Native source stays in its own workspace; GPUI and native driver builds do not
# alter each other's dependency resolution.
[workspace]
resolver = "2"
members = ["crates/*"]
exclude = [
    "vendor/point/crates/point-computer-core",
    "vendor/point/crates/point-computer-backend",
    "vendor/point/crates/point-computer-overlay",
    "vendor/point/crates/point-computer-macos",
    "vendor/point/crates/point-computer-windows",
]

[dependencies]
computer-runtime = { path = "crates/computer-runtime" }

[target.'cfg(target_os = "macos")'.dependencies]
computer-macos = { path = "crates/computer-macos" }

[target.'cfg(target_os = "windows")'.dependencies]
computer-windows = { path = "crates/computer-windows" }

[target.'cfg(target_os = "linux")'.dependencies]
computer-linux = { path = "crates/computer-linux" }

[profile.dev]
debug = 0

[profile.release]
opt-level = "s"
lto = "thin"
