[package]
workspace = "../.."
name = "point-computer-windows"
description = "Windows bounded UIA, focused input, JPEG and explicit global pointer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
point-computer-core = { path = "../point-computer-core" }
point-computer-backend = { path = "../point-computer-backend" }
point-computer-overlay = { path = "../point-computer-overlay" }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Foundation", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Security", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
