[workspace]
members = ["crates/pero-contracts", "crates/pero-codemode", "crates/pero-runtime", "crates/pero-host", "crates/pero-ui", "crates/pero-worker"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pero-contracts = { path = "crates/pero-contracts" }
pero-codemode = { path = "crates/pero-codemode" }
pero-runtime = { path = "crates/pero-runtime" }
gpui-kit = "=0.8.1"

[profile.dev]
debug = 0

[profile.release]
opt-level = "s"
lto = "thin"
