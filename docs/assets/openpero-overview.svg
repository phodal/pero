<text x="84" y="192" font-size="24" fill="#EAF1F8" font-weight="650" >Question</text>
<text x="84" y="230" font-size="18" fill="#ACBBCB" font-weight="400" >GitHub Issue,</text>
<text x="84" y="255" font-size="18" fill="#ACBBCB" font-weight="400" >researcher request,</text>
<text x="84" y="280" font-size="18" fill="#ACBBCB" font-weight="400" >or agent suggestion</text>
<text x="347" y="122" font-size="15" fill="#55D5DD" font-weight="500" font-family="SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1.5">02 SPECIFY</text>
<rect x="347" y="148" width="235" height="160" rx="10" fill="#192A3B" stroke="#34485D" stroke-width="1.5"/>
<text x="367" y="192" font-size="24" fill="#EAF1F8" font-weight="650" >Task contract</text>
<text x="367" y="230" font-size="18" fill="#ACBBCB" font-weight="400" >Pinned inputs and</text>
<text x="367" y="255" font-size="18" fill="#ACBBCB" font-weight="400" >method version,</text>
<text x="367" y="280" font-size="18" fill="#ACBBCB" font-weight="400" >acceptance criteria</text>
<text x="630" y="122" font-size="15" fill="#55D5DD" font-weight="500" font-family="SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1.5">03 DO THE WORK</text>
<text x="1018" y="122" font-size="15" fill="#55D5DD" font-weight="500" font-family="SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1.5">04 RECORD</text>
<rect x="1018" y="148" width="235" height="160" rx="10" fill="#192A3B" stroke="#34485D" stroke-width="1.5"/>
<text x="1038" y="192" font-size="24" fill="#EAF1F8" font-weight="650" >Run record</text>
<text x="1038" y="230" font-size="18" fill="#ACBBCB" font-weight="400" >Outputs, parameters,</text>
<text x="1038" y="255" font-size="18" fill="#ACBBCB" font-weight="400" >environment, and</text>
<text x="1038" y="280" font-size="18" fill="#ACBBCB" font-weight="400" >execution log</text>
<text x="1301" y="122" font-size="15" fill="#55D5DD" font-weight="500" font-family="SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1.5">05 ACCEPT</text>
<rect x="1301" y="148" width="235" height="160" rx="10" fill="#12363E" stroke="#55D5DD" stroke-width="1.5"/>
<text x="1321" y="192" font-size="24" fill="#EAF1F8" font-weight="650" >Accepted result</text>
<text x="1321" y="230" font-size="18" fill="#ACBBCB" font-weight="400" >Reviewed against</text>
<text x="1321" y="255" font-size="18" fill="#ACBBCB" font-weight="400" >the baseline, then</text>
<text x="1321" y="280" font-size="18" fill="#ACBBCB" font-weight="400" >added to the project</text>
