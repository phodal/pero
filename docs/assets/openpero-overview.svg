<path d="M 1253 228 H 1299" fill="none" stroke="#55D5DD" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="64" y="392" width="1472" height="112" rx="12" fill="#192A3B" stroke="#34485D" stroke-width="1.5"/>
<text x="96" y="430" font-size="15" fill="#55D5DD" font-weight="500" font-family="SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1.5">PROJECT MEMORY</text>
<text x="1504" y="430" font-size="16" fill="#ACBBCB" font-weight="400" text-anchor="end">Survives sessions, people, and machines</text>
<text x="96" y="472" font-size="24" fill="#EAF1F8" font-weight="500" >Question · Papers · Datasets · Methods · Runs · Decisions · Open questions</text>
