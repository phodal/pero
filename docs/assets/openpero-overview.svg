<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="710" viewBox="0 0 1600 710" role="img" aria-labelledby="title description" xml:lang="en">
<title id="title">Pero — From a question to a result others can build on.</title>
<desc id="description">Target research workflow, not a claim of end-to-end implementation. A question becomes a contract with fixed inputs, method version and acceptance criteria. Researchers, agents and authorized compute perform the work. Outputs, parameters, environment and logs are recorded, independently reviewed against a baseline, then accepted by a person. Accepted results feed future project context. Shared project memory across people and machines remains planned; local project links already exist. Illustrations do not represent measured results.</desc>
