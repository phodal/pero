<text x="954" y="226" font-size="14" fill="#ACBBCB" font-weight="400" text-anchor="end">prepare · propose</text>
<path d="M 582 228 C 606 228, 606 220, 628 220" fill="none" stroke="#55D5DD" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 970 220 C 994 220, 994 228, 1016 228" fill="none" stroke="#55D5DD" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="630" y="252" width="340" height="48" rx="8" fill="#192A3B" stroke="#34485D" stroke-width="1.5"/>
<g fill="none" stroke="#55D5DD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="646" y="264" width="24" height="10" rx="2"/><rect x="646" y="278" width="24" height="10" rx="2"/><path d="M 651 269 h 2 M 651 283 h 2"/></g>
