<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title description" lang="zh-CN">
<title id="title">Pero — 从一个研究问题，到别人可以接着做的成果。</title>
<desc id="description">目标流程。来自 GitHub Issue、研究者或 Agent 的问题被整理成任务契约，固定输入、方法版本与验收标准。研究者、Agent 或计算节点完成任务。运行时保存产物、参数、环境与执行日志，并与基线对照复核后再接受结果。被接受的成果回到项目记忆，为下一个问题提供背景。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#55D5DD" stroke-width="1.6"/></marker></defs>
<rect x="0" y="0" width="1600" height="560" rx="16" fill="#142B45" stroke="none" stroke-width="1.5"/>
<g font-family="Inter, Helvetica Neue, PingFang SC, Microsoft YaHei, Arial, sans-serif">
<text x="64" y="64" font-size="32" fill="#EAF1F8" font-weight="650" >从一个研究问题，到别人可以接着做的成果。</text>
<rect x="1256" y="38" width="280" height="34" rx="6" fill="none" stroke="#34485D" stroke-width="1.5"/>
<text x="1396" y="60" font-size="12" fill="#ACBBCB" font-weight="500" font-family="SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.5" text-anchor="middle">目标流程 · 建设中</text>
<text x="64" y="122" font-size="15" fill="#55D5DD" font-weight="500" font-family="SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1.5">01 提出</text>
<rect x="64" y="148" width="235" height="160" rx="10" fill="#192A3B" stroke="#34485D" stroke-width="1.5"/>
<text x="84" y="192" font-size="24" fill="#EAF1F8" font-weight="650" >研究问题</text>
<text x="84" y="230" font-size="18" fill="#ACBBCB" font-weight="400" >GitHub Issue、</text>
<text x="84" y="255" font-size="18" fill="#ACBBCB" font-weight="400" >研究者请求或</text>
<text x="84" y="280" font-size="18" fill="#ACBBCB" font-weight="400" >Agent 建议</text>
<text x="347" y="122" font-size="15" fill="#55D5DD" font-weight="500" font-family="SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1.5">02 明确</text>
<rect x="347" y="148" width="235" height="160" rx="10" fill="#192A3B" stroke="#34485D" stroke-width="1.5"/>
<text x="367" y="192" font-size="24" fill="#EAF1F8" font-weight="650" >任务契约</text>
<text x="367" y="230" font-size="18" fill="#ACBBCB" font-weight="400" >固定输入与</text>
<text x="367" y="255" font-size="18" fill="#ACBBCB" font-weight="400" >方法版本，</text>
<text x="367" y="280" font-size="18" fill="#ACBBCB" font-weight="400" >写明验收标准</text>
<text x="630" y="122" font-size="15" fill="#55D5DD" font-weight="500" font-family="SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1.5">03 执行</text>
<text x="1018" y="122" font-size="15" fill="#55D5DD" font-weight="500" font-family="SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1.5">04 记录</text>
<rect x="1018" y="148" width="235" height="160" rx="10" fill="#192A3B" stroke="#34485D" stroke-width="1.5"/>
<text x="1038" y="192" font-size="24" fill="#EAF1F8" font-weight="650" >运行记录</text>
<text x="1038" y="230" font-size="18" fill="#ACBBCB" font-weight="400" >产物、参数、</text>
<text x="1038" y="255" font-size="18" fill="#ACBBCB" font-weight="400" >环境与执行日志</text>
<text x="1038" y="280" font-size="18" fill="#ACBBCB" font-weight="400" >一并保存</text>
<text x="1301" y="122" font-size="15" fill="#55D5DD" font-weight="500" font-family="SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1.5">05 接受</text>
<rect x="1301" y="148" width="235" height="160" rx="10" fill="#12363E" stroke="#55D5DD" stroke-width="1.5"/>
<text x="1321" y="192" font-size="24" fill="#EAF1F8" font-weight="650" >接受成果</text>
<text x="1321" y="230" font-size="18" fill="#ACBBCB" font-weight="400" >与基线对照复核，</text>
<text x="1321" y="255" font-size="18" fill="#ACBBCB" font-weight="400" >再纳入项目</text>
<rect x="630" y="140" width="340" height="48" rx="8" fill="#192A3B" stroke="#34485D" stroke-width="1.5"/>
<g fill="none" stroke="#55D5DD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="658" cy="158" r="6"/><path d="M 647 176 C 647 165, 669 165, 669 176"/></g>
<text x="686" y="171" font-size="19" fill="#EAF1F8" font-weight="600" >研究者</text>
<text x="954" y="170" font-size="14" fill="#ACBBCB" font-weight="400" text-anchor="end">判断 · 复核</text>
<path d="M 582 228 C 606 228, 606 164, 628 164" fill="none" stroke="#55D5DD" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 970 164 C 994 164, 994 228, 1016 228" fill="none" stroke="#55D5DD" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="630" y="196" width="340" height="48" rx="8" fill="#192A3B" stroke="#34485D" stroke-width="1.5"/>
<g fill="none" stroke="#55D5DD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M 658 207 C 660 217, 661 218, 671 220 C 661 222, 660 223, 658 233 C 656 223, 655 222, 645 220 C 655 218, 656 217, 658 207 Z"/></g>
<text x="686" y="227" font-size="19" fill="#EAF1F8" font-weight="600" >Agent</text>
<text x="954" y="226" font-size="14" fill="#ACBBCB" font-weight="400" text-anchor="end">准备 · 提议</text>
<path d="M 582 228 C 606 228, 606 220, 628 220" fill="none" stroke="#55D5DD" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 970 220 C 994 220, 994 228, 1016 228" fill="none" stroke="#55D5DD" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="630" y="252" width="340" height="48" rx="8" fill="#192A3B" stroke="#34485D" stroke-width="1.5"/>
<g fill="none" stroke="#55D5DD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="646" y="264" width="24" height="10" rx="2"/><rect x="646" y="278" width="24" height="10" rx="2"/><path d="M 651 269 h 2 M 651 283 h 2"/></g>
<text x="686" y="283" font-size="19" fill="#EAF1F8" font-weight="600" >算力</text>
<text x="954" y="282" font-size="14" fill="#ACBBCB" font-weight="400" text-anchor="end">个人电脑 · 实验室 · 云</text>
<path d="M 582 228 C 606 228, 606 276, 628 276" fill="none" stroke="#55D5DD" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 970 276 C 994 276, 994 228, 1016 228" fill="none" stroke="#55D5DD" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 299 228 H 345" fill="none" stroke="#55D5DD" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 1253 228 H 1299" fill="none" stroke="#55D5DD" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="64" y="392" width="1472" height="112" rx="12" fill="#192A3B" stroke="#34485D" stroke-width="1.5"/>
<text x="96" y="430" font-size="15" fill="#55D5DD" font-weight="500" font-family="SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1.5">项目记忆</text>
<text x="1504" y="430" font-size="16" fill="#ACBBCB" font-weight="400" text-anchor="end">跨会话、跨成员、跨机器保留</text>
<text x="96" y="472" font-size="24" fill="#EAF1F8" font-weight="500" >研究问题 · 文献 · 数据集 · 方法 · 运行记录 · 决定 · 待解决问题</text>
<path d="M 1418.5 308 V 390" fill="none" stroke="#55D5DD" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1430.5" y="356" font-size="15" fill="#55D5DD" font-weight="500" font-family="SFMono-Regular, Menlo, Consolas, monospace">接受</text>
<path d="M 181.5 392 V 310" fill="none" stroke="#55D5DD" stroke-width="2" marker-end="url(#arrow)"/>
<text x="193.5" y="356" font-size="15" fill="#55D5DD" font-weight="500" font-family="SFMono-Regular, Menlo, Consolas, monospace">背景</text>
</g>
</svg>
