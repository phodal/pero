</g>
<text x="494" y="397" font-size="28" fill="#20272B" font-weight="700" text-anchor="middle">任务契约</text>
<text x="494" y="439" font-size="22" fill="#667075" font-weight="400" text-anchor="middle">固定输入、方法版本</text>
<text x="494" y="471" font-size="22" fill="#667075" font-weight="400" text-anchor="middle">与验收标准</text>
<path d="M 623 276 H 671" fill="none" stroke="#667075" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrow0)"/>
