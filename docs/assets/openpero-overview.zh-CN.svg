<text x="1106" y="397" font-size="28" fill="#20272B" font-weight="700" text-anchor="middle">运行记录</text>
<text x="1106" y="439" font-size="22" fill="#667075" font-weight="400" text-anchor="middle">保存产物、参数、</text>
<text x="1106" y="471" font-size="22" fill="#667075" font-weight="400" text-anchor="middle">环境与执行日志</text>
<path d="M 1235 276 H 1283" fill="none" stroke="#667075" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrow0)"/>
<text x="1412" y="157" font-size="21" fill="#667075" font-weight="600" text-anchor="middle">05 复核</text>
<ellipse cx="1412" cy="286" rx="119" ry="79" fill="#F5F7F7"/>
<g transform="translate(1412 274) scale(1.02)">
<path d="M -44 -62 H 21 L 45 -38 V 62 H -44 Z M 21 -62 V -38 H 45" fill="#FFFFFF" stroke="#20272B" stroke-width="2.8"/>
<path d="M -28 -40 H 8" fill="none" stroke="#20272B" stroke-width="4"/>
<path d="M -28 -23 H 25 M -28 -9 H 25 M -28 5 H 13" fill="none" stroke="#D7DCDF" stroke-width="2.2"/>
<circle cx="23" cy="39" r="26" fill="#FFFFFF" stroke="#20272B" stroke-width="2.4"/>
<path d="M 9 39 L 19 49 L 38 28" fill="none" stroke="#20272B" stroke-width="3"/>
</g>
<text x="1412" y="397" font-size="28" fill="#20272B" font-weight="700" text-anchor="middle">接受成果</text>
<text x="1412" y="439" font-size="22" fill="#667075" font-weight="400" text-anchor="middle">对照基线独立检查，</text>
<text x="1412" y="471" font-size="22" fill="#667075" font-weight="400" text-anchor="middle">由人决定是否接受</text>
<rect x="64" y="561" width="1472" height="115" rx="14" fill="#F5F7F7" stroke="#D7DCDF" stroke-width="2" stroke-dasharray="7 6"/>
<g transform="translate(120 617) scale(0.49)">
