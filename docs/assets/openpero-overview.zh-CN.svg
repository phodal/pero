<path d="M -37 5 L 0 26 L 38 3 M 0 26 L 35 43" fill="none" stroke="#667075" stroke-width="2.2"/>
<circle cx="-37" cy="5" r="6" fill="#FFFFFF" stroke="#20272B" stroke-width="2.4"/>
<circle cx="0" cy="26" r="6" fill="#FFFFFF" stroke="#20272B" stroke-width="2.4"/>
<circle cx="38" cy="3" r="6" fill="#FFFFFF" stroke="#20272B" stroke-width="2.4"/>
<circle cx="35" cy="43" r="6" fill="#FFFFFF" stroke="#20272B" stroke-width="2.4"/>
</g>
<text x="175" y="602" font-size="26" fill="#20272B" font-weight="600" text-anchor="start">项目记忆</text>
<text x="175" y="642" font-size="23" fill="#20272B" font-weight="400" text-anchor="start">研究问题 · 文献 · 数据 · 方法 · 运行记录 · 决定 · 待解决问题</text>
<text x="1496" y="602" font-size="21" fill="#667075" font-weight="400" text-anchor="end">共享延续仍在规划；本地项目引用已有实现。</text>
<path d="M 1412 489 V 530 H 1472 V 558" fill="none" stroke="#667075" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrow0)"/>
