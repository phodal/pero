<circle cx="34" cy="-19" r="14" fill="#FFFFFF" stroke="#20272B" stroke-width="2.4"/>
<path d="M 11 31 V 15 C 11 -6 57 -6 57 15 V 31 Z" fill="#FFFFFF" stroke="#20272B" stroke-width="2.8"/>
</g>
<g transform="translate(812 306) scale(0.85)">
<rect x="-65" y="-47" width="130" height="87" rx="8" fill="#FFFFFF" stroke="#20272B" stroke-width="2.8"/>
<rect x="-54" y="-35" width="108" height="62" rx="2" fill="#F5F7F7" stroke="none" stroke-width="2"/>
<path d="M -65 40 L -80 54 H 80 L 65 40 M -21 47 H 21" fill="none" stroke="#20272B" stroke-width="2.8"/>
<path d="M -25 -13 L -38 0 L -25 13 M 25 -13 L 38 0 L 25 13 M 7 -21 L -7 22" fill="none" stroke="#667075" stroke-width="2.6"/>
