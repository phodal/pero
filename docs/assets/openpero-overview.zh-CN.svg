</g>
<text x="188" y="397" font-size="28" fill="#20272B" font-weight="700" text-anchor="middle">研究问题</text>
<text x="188" y="439" font-size="22" fill="#667075" font-weight="400" text-anchor="middle">GitHub Issue、研究者请求</text>
<text x="188" y="471" font-size="22" fill="#667075" font-weight="400" text-anchor="middle">或 Agent 建议</text>
<path d="M 317 276 H 365" fill="none" stroke="#667075" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrow0)"/>
<text x="494" y="157" font-size="21" fill="#667075" font-weight="600" text-anchor="middle">02 明确</text>
<ellipse cx="494" cy="286" rx="119" ry="79" fill="#F5F7F7"/>
<g transform="translate(494 274) scale(1.02)">
<path d="M -44 -62 H 21 L 45 -38 V 62 H -44 Z M 21 -62 V -38 H 45" fill="#FFFFFF" stroke="#20272B" stroke-width="2.8"/>
<path d="M -28 -40 H 8" fill="none" stroke="#20272B" stroke-width="4"/>
<path d="M -28 -23 H 25 M -28 -9 H 25 M -28 5 H 13" fill="none" stroke="#D7DCDF" stroke-width="2.2"/>
<rect x="-28" y="16" width="10" height="10" rx="1" fill="#FFFFFF" stroke="#667075" stroke-width="2"/>
<path d="M -8 22 H 27" fill="none" stroke="#667075" stroke-width="2.2"/>
