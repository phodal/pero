<text x="800" y="397" font-size="25" fill="#20272B" font-weight="700" text-anchor="middle">研究者 · Agent · 算力</text>
<text x="800" y="439" font-size="22" fill="#667075" font-weight="400" text-anchor="middle">人负责判断与复核</text>
<text x="800" y="471" font-size="22" fill="#667075" font-weight="400" text-anchor="middle">Agent 准备与提议</text>
<text x="800" y="503" font-size="22" fill="#667075" font-weight="400" text-anchor="middle">获准的本地或远程执行</text>
<path d="M 929 276 H 977" fill="none" stroke="#667075" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrow0)"/>
<text x="1106" y="157" font-size="21" fill="#667075" font-weight="600" text-anchor="middle">04 记录</text>
<ellipse cx="1106" cy="286" rx="119" ry="79" fill="#F5F7F7"/>
<g transform="translate(1106 274) scale(1.02)">
