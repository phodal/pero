<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="710" viewBox="0 0 1600 710" role="img" aria-labelledby="title description" xml:lang="zh-CN">
<title id="title">Pero — 从一个研究问题，到别人可以接着做的成果。</title>
<desc id="description">目标科研流程，不表示端到端能力已经实现。问题形成固定输入、方法版本与验收标准的任务契约。研究者、Agent 与获准算力执行任务，记录产物、参数、环境与日志，独立对照基线复核，由人接受成果。成果成为后续项目背景。跨成员、跨机器的共享项目记忆仍是目标，本地项目引用已有实现。插画不表示实测结果。</desc>
<defs>
<marker id="arrow0" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 9 6 L 2 10" fill="none" stroke="#667075" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow1" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 9 6 L 2 10" fill="none" stroke="#A87531" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>text{font-family:"Noto Sans CJK SC","Noto Sans CJK","PingFang SC","Microsoft YaHei",Arial,sans-serif}path,line,rect,circle,ellipse{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1600" height="710" fill="#FFFFFF"/>
<text x="64" y="60" font-size="36" fill="#20272B" font-weight="700" text-anchor="start">从一个研究问题，到别人可以接着做的成果。</text>
<text x="64" y="102" font-size="20" fill="#667075" font-weight="500" text-anchor="start">目标流程 · 建设中</text>
<text x="188" y="157" font-size="21" fill="#20272B" font-weight="600" text-anchor="middle">01 提出</text>
<ellipse cx="188" cy="286" rx="119" ry="79" fill="#FBF3E7"/>
<g transform="translate(188 274) scale(1.02)">
<path d="M -44 -62 H 21 L 45 -38 V 62 H -44 Z M 21 -62 V -38 H 45" fill="#FFFFFF" stroke="#A87531" stroke-width="2.8"/>
<path d="M -28 -40 H 8" fill="none" stroke="#A87531" stroke-width="4"/>
<path d="M -28 -23 H 25 M -28 -9 H 25 M -28 5 H 13" fill="none" stroke="#D7DCDF" stroke-width="2.2"/>
