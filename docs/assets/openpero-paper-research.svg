<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1370" viewBox="0 0 1600 1370" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Pero Paper research: import, read, ask, and check the source</title>
<desc id="desc">Simplified editorial UI schematics, not screenshots. Based on Paper UI source at master aea25549 and cross-checked against the v0.1.0-dev.20261104 source tag. Only their shared first-use controls are illustrated. Step one opens Paper, Add papers, PDF, and Import PDF. Step two reads the saved original PDF and selects text for Highlight or Discuss selection; Ask AI is also in the reader header. Step three places a frozen paper or passage reference into the shared Host Chat draft. The user reviews and sends it using configured Agent access. The Agent can read and search saved sources and submit an evidence-linked report. Step four closes Chat and opens the reader clock control, Research record, to inspect a saved report, reviews unverified conclusions and limitations, and follows citations back to original PDF pages or regions, and can continue from the saved result. Ambiguous citations require Citation evidence selection. Sample paper lines, page numbers and questions illustrate the interaction and are not research findings. Reading and annotation do not need a model. This diagram does not claim autonomous-research, scientific-quality, native-package or production acceptance. Latest downloadable preview v0.1.0-dev.20261104 is a separate older revision from current master.</desc>
