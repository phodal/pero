<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1370" viewBox="0 0 1600 1370" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">Pero 论文研究：导入、阅读、提问并回查原文</title>
<desc id="desc">这是一张简化的界面示意图，不是产品截图。以主干 aea25549 的 Paper 界面源码为基础，并与 v0.1.0-dev.20261104 源码标签交叉核对，只展示两者共有的首次使用控件。第一步进入论文、添加论文、PDF、导入 PDF。第二步阅读已保存的原始 PDF，选择文字后高亮或讨论选段，也可使用阅读器顶栏的询问 AI。第三步把固定的论文或选段引用加入共享 Host 对话草稿，由用户检查并通过已配置的 Agent 发送。Agent 可读取和检索已保存来源，记录证据并提交带引用的报告。第四步收起对话，打开阅读器时钟图标的研究记录，检查保存的报告、未核验的结论和局限，点击引用回到原始 PDF 页或选区，也可从此处追问。匹配不唯一时，需要在引用证据中选择位置。图中的论文线条、页码和问题只说明交互，不代表真实研究发现。阅读和标注不需要模型。本图不宣称自动研究、科学质量、原生安装包或生产验收通过。检查时最新已发布的预览包 v0.1.0-dev.20261104 与主干是不同版本。</desc>
