<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1350" viewBox="0 0 1600 1350" role="img" aria-labelledby="title description" xml:lang="en">
<title id="title">Pero — Coordinate shared work. Keep execution with its owner.</title>
<desc id="description">Pero architecture, combining implementation foundations and explicitly planned integration. Desktop and GitHub intake exist; shared Web and mobile clients remain targets. The Go control plane owns shared task coordination. Rust Host and Worker own local permissions, credentials, sessions and execution. Local research Projects link App-owned records, not a shared scientific journal. Apps, local Agent Plugins, MCP connectors and replaceable ACP backends have implementation foundations. Shared project knowledge, journal sync and unified delivery remain planned. Local and owner-specific compute adapters exist with scope-specific acceptance; real sites and deployments have separate gates. Artifact versions exist in sessions, but independent verification and human acceptance are not yet one shared Task/Run delivery loop.</desc>
