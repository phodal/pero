<title id="title">Pero — Overall Architecture</title>
<desc id="description">Target architecture derived from ROADMAP.md. Clients access shared Cloud coordination and Host execution through versioned contracts. Host owns local permissions, credentials and execution identity. Apps, playbooks, connectors and replaceable agents use authorized environments. Artifacts pass independent verification and human acceptance before returning to project knowledge. Dashed modules and connections are planned; solid outlines indicate existing foundations only.</desc>
