<title id="title">Pero 论文：04 · 回查</title>
<desc id="desc">研究记录侧栏展示按日期分组的问题及保存状态、所选报告详情、结论尚未核验提示、指回第 2 页的引用、局限与缺口，以及从此处追问。 依据 2026-11-07 审阅的用户文库、PDF 选文与共享对话截图绘制的简化界面示意，截图对应的应用版本未知；旧受控 fixture 截图辅助确认导入与阅读器布局，未截图的研究记录和报告状态以 c12c2ab0 的 Paper 源码补全。标题、合集、计数、页码、问题、日期及正文线条均为示例占位，不含用户数据或研究结论。金色仅表示插画强调，不表示核验通过。本图不代表本次真实界面运行、固定版本认证、科学质量、原生安装包或生产验收。</desc>
