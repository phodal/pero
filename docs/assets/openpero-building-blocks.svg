<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title description" xml:lang="en">
<title id="title">Pero — Domain Apps, composed for people and agents.</title>
<desc id="description">A domain defines methods, inputs, outputs and checks. Its App owns UI, data and an optional backend, reused in a standalone Product or the Workbench. Implemented local App Agent Plugin declarations and dependency packages supply instructions, Skills and MCP to Host-owned ACP sessions. Declared App data routes remain scoped and approved. App SDK and Host own lifecycle, processes, credentials and sessions; each Product has its own Host and data. App-to-Task/Run and remote deployment integration remain planned. Solid lines mean implementation foundations, not acceptance on every platform.</desc>
