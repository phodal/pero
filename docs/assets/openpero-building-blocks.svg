<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="732" viewBox="0 0 1200 732" role="img" aria-labelledby="title description" lang="en">
<title id="title">Pero — Domain building blocks</title>
<desc id="description">Conceptual composition: a domain defines methods, inputs, outputs and checks. Its App owns a user interface, data and an optional backend, and is reused in standalone products or the Pero workbench. A planned Agent Plugin groups Skills (instructions) and Tools (MCP or connectors), exposing domain methods to Host-owned Agent sessions. The App SDK and Host runtime provide the shared foundation. Dashed outlines and connections mark planned integration; Plugin is not a supported App manifest field today.</desc>
