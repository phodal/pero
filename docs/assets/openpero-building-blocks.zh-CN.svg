<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title description" xml:lang="zh-CN">
<title id="title">Pero — 领域 App，为研究者与 Agent 组合能力。</title>
<desc id="description">领域定义方法、输入、输出与检查规则。App 拥有界面、数据与可选后端，可复用于独立 Product 和工作台。已有本地 App Agent Plugin 声明与依赖包，为 Host 拥有的 ACP 会话提供指引、Skills 和 MCP；声明的 App 数据路由仍受范围和审批约束。App SDK 与 Host 负责生命周期、进程、凭据与会话，各 Product 保持自己的 Host 和数据。App 到 Task/Run、远程部署仍待集成。实线只表示实现基础，不表示所有平台均已验收。</desc>
