<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1350" viewBox="0 0 1600 1350" role="img" aria-labelledby="title description" xml:lang="zh-CN">
<title id="title">Pero — 协调共享工作，让执行留在所属环境。</title>
<desc id="description">Pero 架构，同时展示已有实现基础和明确的规划接线。Desktop 与 GitHub 来源导入已有基础，共享 Web 和移动客户端仍是目标。Go 控制面拥有共享任务协调，Rust Host 与 Worker 拥有本机权限、凭据、会话和执行。本地研究项目引用 App 自有记录，不等于共享科学台账。App、本地 Agent Plugin、MCP 连接器与可替换 ACP 后端已有实现基础；共享项目知识、journal 同步与统一交付仍待建设。本地与各资源所有者的算力适配已有局部验收，真实站点和部署单独验收。会话已有产物版本，但独立验证与人工接受尚未组成共享 Task/Run 的完整交付闭环。</desc>
