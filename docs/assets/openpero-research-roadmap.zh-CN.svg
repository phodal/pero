<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1050" viewBox="0 0 2400 1050" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">Pero 科研路线图</title>
<desc id="desc">战略建议，不代表能力已经完成。第一阶段优先复核已发表结果：从论文方法到计算复算与结果比对，再由第二位研究者在干净环境中独立复算。通过独立复算验证后，比较对照、消融与参数实验，决定下一步实验。通过有效比较验证后，支持研究在不同人员和环境之间持续推进，同时保留既有结论及其历史。证据索引、数据版本、可重建环境、过程记录与权限构成按阶段补齐的共享底座。现有基础限于论文证据、数据版本及局部实验或环境。图中曲线和图标仅作流程示意，不代表实测结果。</desc>
